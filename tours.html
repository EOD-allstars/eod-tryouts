<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tour · EOD Allstars</title>
<meta name="description" content="Book a free 20 minute tour of the EOD Allstars gym.">
<meta name="theme-color" content="#08070A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Matches the EOD placements site: dark cinema look, dimmed footage, pink glow, glass panels */
:root{color-scheme:dark;
  --ink:#08070A;--glow:#3D1233;--pink:#FF4FA8;--pink-soft:#F7A8D3;--chrome:#ECE9EF;--muted:#B9AEB6;--silver:#8E8A94;--graphite:#18171B;
  --glass:rgba(20,19,24,.62);--edge:rgba(255,255,255,.12);--ok:#5BE39A;--bad:#FF8FC5;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;--wide:"Michroma","Eurostile",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{min-height:100vh;color:var(--chrome);font-family:var(--display);-webkit-text-size-adjust:100%;overflow-x:hidden;background:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
/* background layers */
#bgv{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--ink);pointer-events:none}
#bgv video{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;opacity:.32;filter:blur(2px) saturate(1.05)}
#bgv .amb{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 30%,var(--glow) 0%,transparent 70%);opacity:.8}
#bgv .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.7) 100%)}
#bgv .grain{position:absolute;inset:-50%;opacity:.5;animation:grain .6s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-6%,4%)}40%{transform:translate(5%,-7%)}60%{transform:translate(-3%,8%)}80%{transform:translate(7%,2%)}100%{transform:translate(0,0)}}
@media(prefers-reduced-motion:reduce){#bgv .grain{animation:none}}
#app{max-width:600px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));position:relative}
/* hero */
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin:0 0 22px}
header img{width:clamp(110px,28vw,150px);height:auto;filter:drop-shadow(0 0 22px rgba(255,79,168,.4))}
.eyebrow{font-family:var(--wide);font-size:clamp(11px,2.6vw,13px);letter-spacing:.3em;text-transform:uppercase;color:var(--pink-soft)}
h1{display:flex;gap:0 .25em;flex-wrap:wrap;justify-content:center;font-weight:900;text-transform:uppercase;font-size:clamp(42px,12vw,84px);line-height:.92;
  filter:drop-shadow(0 0 30px rgba(255,79,168,.5));text-align:center}
h1 span{background:linear-gradient(180deg,#FFFFFF 0%,#FFE0F0 45%,#FF4FA8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span:last-child{background:linear-gradient(180deg,#FFFFFF 0%,#DCD7E0 48%,#FFFFFF 52%,#8E8A94 100%);-webkit-background-clip:text;background-clip:text}
.lead{color:var(--muted);font-size:15px;font-weight:600;line-height:1.55;text-align:center;max-width:460px;margin:0 auto 20px}
.facts{display:flex;gap:10px;justify-content:center;margin:0 auto 24px;max-width:460px}
.fact{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;background:var(--glass);border:1px solid var(--edge);border-radius:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fact b{font-family:var(--wide);font-weight:400;font-size:clamp(17px,5vw,26px);line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,79,168,.55);white-space:nowrap}
.fact small{font-family:var(--wide);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.steps i.on{background:var(--pink);box-shadow:0 0 10px rgba(255,79,168,.7)}
/* panels */
.card{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:18px 16px;margin:0 0 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
h2{font-family:var(--wide);font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--pink-soft);margin:0 0 14px}
.wk{font-weight:800;font-size:15px;color:#fff;margin:0 0 10px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.calhead b{font-family:var(--wide);font-weight:400;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff}
.mnav{width:42px;height:42px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);font-size:20px;line-height:1;color:#fff}
.mnav:not(:disabled):hover{border-color:var(--pink)}
.mnav:disabled{opacity:.25;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cw{text-align:center;font-family:var(--wide);font-size:8.5px;letter-spacing:.14em;color:var(--muted);padding:2px 0 6px;text-transform:uppercase}
.cd{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:2px;border:1px solid transparent}
.cd b{font-weight:800;font-size:17px;line-height:1.1}
.cd small{font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;max-width:100%}
.cd.empty{visibility:hidden}
.cd.off{color:rgba(236,233,239,.22)}.cd.off.wk{color:rgba(236,233,239,.14)}
.cd.op{background:rgba(255,79,168,.12);border-color:rgba(255,79,168,.38);color:#fff}.cd.op small{color:var(--pink-soft)}
.cd.op:hover{border-color:var(--pink);box-shadow:0 0 14px rgba(255,79,168,.35)}
.cd.full{background:rgba(255,255,255,.04);color:rgba(236,233,239,.35)}.cd.full small{color:rgba(236,233,239,.35)}
.cd small{line-height:1}
.cd.on{background:var(--pink);border-color:var(--pink);color:var(--ink);box-shadow:0 0 18px rgba(255,79,168,.6)}.cd.on small{color:var(--ink)}
.cd.today b{text-decoration:underline;text-underline-offset:3px}
.legend{display:flex;gap:16px;justify-content:center;margin-top:14px;font-size:12px;font-weight:600;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}.lg{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg.op{background:rgba(255,79,168,.12);border:1px solid rgba(255,79,168,.38)}.lg.full{background:rgba(255,255,255,.06)}
/* times */
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.time{border:1.5px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 4px;font-weight:800;font-size:15px;text-align:center;color:#fff;background:rgba(0,0,0,.3)}
.time small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);margin-top:3px}
.time:not(:disabled):hover{border-color:var(--pink)}
.time.on{background:var(--pink);border-color:var(--pink);color:var(--ink);box-shadow:0 0 18px rgba(255,79,168,.5)}.time.on small{color:var(--ink)}
.time:disabled{color:rgba(236,233,239,.28);border-color:rgba(255,255,255,.08);text-decoration:line-through;cursor:default;background:transparent}
.help{color:var(--muted);font-size:13px;font-weight:600;line-height:1.5}
/* chosen time */
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,79,168,.12);border:1px solid rgba(255,79,168,.4);border-radius:16px;padding:13px 16px;margin:0 0 14px}
.pick b{font-weight:800;font-size:15px;color:#fff}.pick span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.pick button{font-weight:800;font-size:12px;color:var(--pink-soft);text-decoration:underline}
/* form */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-family:var(--wide);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--chrome);margin:0 0 7px}
label.f>span i{font-family:var(--display);font-style:normal;font-weight:600;font-size:11px;letter-spacing:0;text-transform:none;color:var(--muted)}
input,select,textarea{width:100%;color:#fff;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.28);border-radius:14px;padding:13px 16px;font-size:16px;font-weight:600;outline:none}
input::placeholder,textarea::placeholder{color:rgba(236,233,239,.35)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,79,168,.2)}
label.f>span.kidrow{display:flex;gap:8px;align-items:center;margin:0;font:inherit;text-transform:none;letter-spacing:0}
.kidrow input{flex:1}
.kidx{flex:none;width:46px;height:48px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);color:var(--muted);font-size:15px}
.addkid{display:block;width:100%;border:1.5px dashed rgba(255,79,168,.55);border-radius:14px;padding:12px;font-weight:800;font-size:13px;color:var(--pink-soft);margin:0 0 6px}
.sect{font-family:var(--wide);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--pink-soft);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--edge)}
.sect:first-child{margin-top:0;padding-top:0;border:0}
.btn{display:block;width:100%;font:800 15px var(--display);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:16px 26px;border:2px solid var(--pink);background:var(--pink);color:var(--ink);
  box-shadow:0 0 0 6px rgba(255,79,168,.14),0 0 34px rgba(255,79,168,.4)}
.btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);box-shadow:none}
.err{background:rgba(255,79,168,.14);border:1px solid rgba(255,79,168,.5);color:#FFD1E8;border-radius:14px;padding:11px 14px;font-size:14px;margin:0 0 12px;font-weight:700}
.bad{border-color:var(--bad)!important;box-shadow:0 0 0 4px rgba(255,143,197,.18)!important}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
/* done */
.done{text-align:center}
.tick{width:76px;height:76px;border-radius:50%;background:rgba(255,79,168,.15);border:1.5px solid var(--pink);color:var(--pink);display:grid;place-items:center;font-size:36px;margin:4px auto 16px;box-shadow:0 0 30px rgba(255,79,168,.45)}
.done h1{font-size:clamp(34px,10vw,54px);margin:0 0 10px}
.done .lead{margin:0 auto}
.sum{text-align:left;background:rgba(0,0,0,.35);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;margin:16px 0}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.sum div span{font-family:var(--wide);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:3px}.sum div b{text-align:right;color:#fff}
.cal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.cal a,.cal button{display:block;text-align:center;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 6px;font-weight:800;font-size:13px;color:#fff;text-decoration:none}
.note{font-size:13px;font-weight:600;color:var(--muted);line-height:1.5;margin-top:6px}
.loading{text-align:center;color:var(--muted);padding:30px 0;font-family:var(--wide);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
footer{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-top:22px;line-height:1.7}
footer a{color:var(--pink-soft)}
.calwk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calgrid{grid-auto-rows:clamp(35px,9.2vw,50px)}
.facts1{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 12px;font-family:var(--wide);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--chrome)}
.facts1 i{font-style:normal;color:var(--pink)}
.row2{display:grid;grid-template-columns:1fr 1.25fr;gap:8px}
.slotshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 8px;padding-top:12px;border-top:1px solid var(--edge)}
.slotshead b{font-size:14px;color:#fff}.slotshead span{font-size:11px;font-weight:600;color:var(--muted)}
.slotsnone{text-align:center;margin:12px 0 2px;padding-top:12px;border-top:1px solid var(--edge)}
/* compact phone layout: each step fits on one screen */
header{gap:6px;margin:0 0 8px}
header img{width:clamp(56px,15vw,96px)}
header.mini{flex-direction:row;justify-content:center;gap:12px;margin:0 0 12px}header.mini img{width:54px}
h1{font-size:clamp(32px,9.5vw,64px);margin:0 0 4px}
.lead{font-size:13.5px;margin:0 auto 12px;line-height:1.45}
.facts{gap:8px;margin:0 auto 14px}.fact{padding:9px 4px 8px;gap:5px}.fact b{font-size:clamp(15px,4.4vw,22px)}
.steps{margin:0 0 12px}
.card{padding:14px 12px;margin:0 0 12px}
h2{margin:0 0 10px;font-size:11px}
.calhead{margin:0 0 8px}.mnav{width:36px;height:36px;font-size:18px}
.calgrid{gap:4px}.cw{padding:0 0 4px}
.cd{aspect-ratio:auto;height:100%;border-radius:10px}
.cd b{font-size:15px}.cd small{font-size:8.5px}
.legend{margin-top:10px;font-size:11px}
.pick{padding:11px 14px;margin:0 0 12px}.pick.prev{margin:0 0 10px}
.time{padding:11px 4px;font-size:14.5px}
label.f{margin:0 0 10px}label.f>span{margin:0 0 5px}
input,select,textarea{padding:11px 14px}
.kidx{height:44px}
.addkid{padding:9px;margin:0 0 12px}
.sect{margin:12px 0 8px;padding-top:10px}
.btn{padding:14px 22px}
footer{margin-top:12px;font-size:11px}
.done h1{font-size:clamp(30px,9vw,48px)}.tick{width:62px;height:62px;font-size:30px;margin:0 auto 10px}.sum{margin:12px 0}
@media(min-width:700px){header img{width:130px}h1{font-size:76px}.lead{font-size:15px}.calgrid{grid-auto-rows:50px}.cd b{font-size:17px}.card{padding:18px 16px}}
@media(max-width:700px){.lead{display:none}}
@media(max-width:700px){header .eyebrow{display:none}footer{margin-top:8px}}
@media(max-height:620px) and (max-width:700px){header img{width:44px}header{margin:0 0 2px}h1{font-size:28px;margin:0 0 2px}.facts1{display:none}.calgrid{grid-auto-rows:32px}.cd small{display:none}.card{padding:10px}.time{padding:9px 4px}.mnav{width:32px;height:32px}footer{display:none}}
@media(max-width:380px){.times{grid-template-columns:repeat(2,1fr)}.cd b{font-size:15px}.cd small{font-size:8px}.calgrid{gap:3px}}
</style>
</head>
<body>
<div id="bgv" aria-hidden="true"></div>
<div id="app"><div class="loading">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   SETTINGS: edit these to change the page
   ===================================================================== */
const GYM = {
  name: "EOD Allstars",
  address: "",          // e.g. "12 Example St, Rutherford NSW 2320" (shown on the confirmation)
  phone: "",            // e.g. "0400 000 000"
  email: ""             // e.g. "info@eodallstars.com"
};
// Confirmation emails (free at emailjs.com). Leave blank to switch off.
const EMAILJS = {
  publicKey: "",        // Account > General > Public key
  serviceId: "",        // Email Services > your gym email > Service ID
  templateId: ""        // Email Templates > your tour template > Template ID
};
const DAYS = [1,2,3,4,5];                                  // Mon to Fri
const SLOTS = ["16:30","16:50","17:10","17:30","17:50","18:10"]; // 20 min tours, last one ends 6:30
const TOUR_MINS = 20;
const LAST_TOUR_DAY = "2026-12-09"; // no tours after this date (leave "" for no end date)
const CLOSED = [                     // gym closed: [first day, last day, reason]
  ["2026-11-07","2026-11-08","Cheerbrandz"],
  ["2026-11-14","2026-11-15","CheerCon"],
  ["2026-11-25","2026-12-01","Nationals"],
  ["2026-12-10","2026-12-10","Dance concert"],
  ["2026-12-14","2026-12-17","Hamilton Island"],
  ["2026-12-19","2026-12-19","Banquet"]
];
const MONTHS_AHEAD = 1;       // this month plus this many more (1 = this month and next)
const BG_VIDEO = "bg.mp4";          // background video file or link, e.g. "bg.mp4" (plays muted). Blank = no video
const MIN_NOTICE_HOURS = 2;   // can't book a slot starting sooner than this
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6cgGaPcI45pMzGc-ehPBxztHSPhWdZWs",
  authDomain: "eod-tryouts.firebaseapp.com",
  projectId: "eod-tryouts",
  storageBucket: "eod-tryouts.firebasestorage.app",
  messagingSenderId: "213167019146",
  appId: "1:213167019146:web:ec8f6e265acf90e1bb0973"
};
/* ===================================================================== */

const TZ="Australia/Sydney";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WDL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function sydParts(ms){const p={};new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);return {date:`${p.year}-${p.month}-${p.day}`,mins:(+p.hour%24)*60+(+p.minute)}}
function sydToMs(date,hhmm){const [y,m,d]=date.split("-").map(Number),[h,mi]=hhmm.split(":").map(Number);let t=Date.UTC(y,m-1,d,h,mi);
  for(let i=0;i<2;i++){const p=sydParts(t),[py,pm,pd]=p.date.split("-").map(Number);const wall=Date.UTC(py,pm-1,pd,Math.floor(p.mins/60),p.mins%60);t+=Date.UTC(y,m-1,d,h,mi)-wall}return t}
function addDays(date,n){const [y,m,d]=date.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+n));return `${x.getUTCFullYear()}-${pad(x.getUTCMonth()+1)}-${pad(x.getUTCDate())}`}
function dow(date){const [y,m,d]=date.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
function niceTime(hhmm){let [h,m]=hhmm.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return `${h}:${pad(m)}${ap}`}
function endTime(hhmm){const [h,m]=hhmm.split(":").map(Number),t=h*60+m+TOUR_MINS;return `${pad(Math.floor(t/60))}:${pad(t%60)}`}
function niceDate(date,long){const [y,m,d]=date.split("-").map(Number);return long?`${WDL[dow(date)]} ${d} ${MON[m-1]}`:`${WD[dow(date)]} ${d} ${MON[m-1]}`}
const keyOf=(date,hhmm)=>`${date}_${hhmm.replace(":","")}`;

/* ---------- background video ---------- */
(function bg(){const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#bgv").innerHTML=`${BG_VIDEO?`<video ${reduce?"":"autoplay"} muted loop playsinline preload="auto" poster="bg.jpg" src="${esc(BG_VIDEO)}"></video>`:""}<span class="amb"></span><span class="vig"></span><span class="grain"></span>`;
  const v=$("#bgv video");if(v){v.muted=true;v.play&&v.play().catch(()=>{})}
  try{const g=document.createElement("canvas");g.width=g.height=160;const gc=g.getContext("2d"),img=gc.createImageData(160,160);
    for(let i=0;i<img.data.length;i+=4){const x=Math.random()*255;img.data[i]=img.data[i+1]=img.data[i+2]=x;img.data[i+3]=26}
    gc.putImageData(img,0,0);$("#bgv .grain").style.backgroundImage="url("+g.toDataURL()+")"}catch(e){}})();

/* ---------- data: Firebase, or this device only when apiKey is empty ---------- */
const DEMO=!FIREBASE_CONFIG.apiKey;
const DB=DEMO?(()=>{const K="eodth_demo_v5",rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}};
  return {listen(cb){const f=()=>{const d=rd();cb(d.tourSlots||{})};f();window.addEventListener("storage",f)},
    async book(k,tour){const d=rd();d.tourSlots=d.tourSlots||{};d.tours=d.tours||[];if(d.tourSlots[k])throw new Error("taken");
      d.tourSlots[k]={at:tour.at};d.tours.push({id:k,...tour});localStorage.setItem(K,JSON.stringify(d))}}})()
:(()=>{firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore();
  return {listen(cb,err){db.collection("tourSlots").where("at",">=",Date.now()-864e5).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cb(o)},err)},
    async book(k,tour){const b=db.batch();b.set(db.collection("tours").doc(k),tour);b.set(db.collection("tourSlots").doc(k),{at:tour.at});await b.commit()}}})();

/* ---------- state ---------- */
const S={step:1,date:null,time:null,taken:{},loaded:false,err:"",busy:false,done:null,f:{}};
try{const b=JSON.parse(localStorage.getItem("eod_tour_booked")||"null");if(b&&b.at>Date.now())S.prev=b}catch(e){}

function lastDay(){const now=sydParts(Date.now());let [y,m]=now.date.split("-").map(Number);m+=MONTHS_AHEAD+1;while(m>12){m-=12;y++}const e=addDays(`${y}-${pad(m)}-01`,-1);return LAST_TOUR_DAY&&LAST_TOUR_DAY<e?LAST_TOUR_DAY:e}
function closedOn(d){const c=CLOSED.find(x=>d>=x[0]&&d<=x[1]);return c?c[2]:""}
function dayInfo(d){const now=sydParts(Date.now());if(d<now.date||d>lastDay()||!DAYS.includes(dow(d)))return null;
  if(closedOn(d))return {d,slots:[],open:0,closed:true,why:closedOn(d)};
  const slots=SLOTS.map(t=>{const [h,m]=t.split(":").map(Number),k=keyOf(d,t),s=S.taken[k];
    const late=d===now.date&&h*60+m<now.mins+MIN_NOTICE_HOURS*60;return {t,k,open:!s&&!late,blocked:!!(s&&s.blocked),late}});
  return {d,slots,open:slots.filter(s=>s.open).length,closed:slots.every(s=>s.blocked||s.late)&&slots.some(s=>s.blocked)}}
function bookableDays(){const now=sydParts(Date.now()),end=lastDay(),out=[];for(let d=now.date;d<=end;d=addDays(d,1)){const x=dayInfo(d);if(x)out.push(x)}return out}
function render(){
  const app=$("#app");
  const head=`<header class="${S.step===3||S.done?"mini":""}"><img src="icons/logo.webp" alt="EOD Allstars" onerror="this.style.display='none'"><p class="eyebrow">EOD Allstars · Maitland</p></header>`;
  if(S.done)return app.innerHTML=head+vDone();
  if(!S.loaded)return app.innerHTML=head+`<div class="loading">Loading available times…</div>`;
  const hero=S.step===1?`<h1><span>Gym</span> <span>Tour</span></h1>
  <p class="lead">Come and see the gym, meet our coaches and ask us anything about cheer and dance at EOD.</p>
  <p class="facts1"><span>20 min</span><i>·</i><span>Free</span><i>·</i><span>Mon–Fri 4:30–6:30pm</span></p>`:"";
  app.innerHTML=head+hero+`
  ${S.prev&&S.step===1?`<div class="pick prev"><div><b>You already have a tour booked</b><span>${esc(niceDate(S.prev.date,true))} at ${esc(niceTime(S.prev.time))}${S.prev.name?` for ${esc(S.prev.name)}`:""}</span></div></div>`:""}
  ${S.step===3?vForm():vPick()}
  ${S.step===3?"":`<footer>${GYM.phone||GYM.email?`Questions? ${GYM.phone?`Call <a href="tel:${esc(GYM.phone.replace(/\s/g,""))}">${esc(GYM.phone)}</a>`:""}${GYM.phone&&GYM.email?" or ":""}${GYM.email?`email <a href="mailto:${esc(GYM.email)}">${esc(GYM.email)}</a>`:""} · `:""}All times are Sydney time.</footer>`}`;
  if(S.step===3){restore();const el=$("#f-first");if(el&&!S.f.kid0&&window.innerWidth>700)el.focus({preventScroll:true})}
}
function vPick(){
  const days=bookableDays(),now=sydParts(Date.now());
  if(!days.some(x=>x.open))return `<div class="card"><h2>No times left</h2><p class="help">All tour times are booked for now, or tours are finished for the year. ${GYM.phone||GYM.email?"Get in touch and we'll find a time that works.":"Please check back soon."}</p></div>`;
  const first=now.date.slice(0,7),last=lastDay().slice(0,7);
  if(!S.date||!days.some(x=>x.d===S.date&&x.open)){S.date=(days.find(x=>x.open&&(!S.month||x.d.startsWith(S.month)))||days.find(x=>x.open)||{}).d||null;S.time=null}
  if(!S.month)S.month=(S.date||(days.find(x=>x.open)||{}).d||now.date).slice(0,7);
  const [y,m]=S.month.split("-").map(Number),start=`${S.month}-01`,dim=new Date(Date.UTC(y,m,0)).getUTCDate(),lead=(dow(start)+6)%7;
  let cells=[];for(let i=0;i<lead;i++)cells.push(`<span class="cd empty"></span>`);
  for(let n=1;n<=dim;n++){const d=`${S.month}-${pad(n)}`,x=dayInfo(d),wkend=!DAYS.includes(dow(d));
    if(!x){cells.push(`<span class="cd off ${wkend?"wk":""} ${d===now.date?"today":""}"><b>${n}</b></span>`);continue}
    const lbl=x.open?`${x.open} left`:x.closed?"Closed":"Full";
    cells.push(`<button class="cd ${x.open?"op":"full"} ${x.why?"shut":""} ${d===S.date?"on":""} ${d===now.date?"today":""}" data-day="${d}" ${x.open?"":"disabled"} aria-label="${esc(niceDate(d,true))}, ${x.why?"closed for "+esc(x.why):lbl}" ${x.why?`title="Closed: ${esc(x.why)}"`:""}><b>${n}</b><small>${lbl}</small></button>`)}
  {const wk=[];for(let i=0;i<cells.length;i+=7)wk.push(cells.slice(i,i+7));
    const todayWk=S.month===now.date.slice(0,7)?Math.floor((lead+(+now.date.slice(8))-1)/7):0;cells=wk.slice(todayWk).flat()}
  const mName=["January","February","March","April","May","June","July","August","September","October","November","December"][m-1];
  return `<div class="card">
    <div class="calhead"><button class="mnav" data-month="-1" ${S.month<=first?"disabled":""} aria-label="Previous month">‹</button><b>${mName} ${y}</b><button class="mnav" data-month="1" ${S.month>=last?"disabled":""} aria-label="Next month">›</button></div>
    <div class="calwk">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<span class="cw">${w}</span>`).join("")}</div>
    <div class="calgrid">${cells.join("")}</div>
    ${vSlots()}
  </div>
  <button class="btn" data-go="3" ${S.time&&S.date&&(dayInfo(S.date)||{slots:[]}).slots.some(s=>s.t===S.time&&s.open)?"":"disabled"}>${S.time?`Next: ${esc(niceTime(S.time))} on ${esc(niceDate(S.date))}`:"Pick a time"}</button>`}
function vSlots(){const day=S.date&&S.date.startsWith(S.month)?dayInfo(S.date):null;
  if(!day)return `<p class="help slotsnone">${LAST_TOUR_DAY&&S.month===LAST_TOUR_DAY.slice(0,7)?`Last tour day is ${esc(niceDate(LAST_TOUR_DAY,true))}. `:""}Tap a day to see times.</p>`;
  return `<div class="slotshead"><b>${esc(niceDate(S.date,true))}</b>${LAST_TOUR_DAY&&S.month===LAST_TOUR_DAY.slice(0,7)?`<span>Last tour ${+LAST_TOUR_DAY.slice(8)} ${MON[+LAST_TOUR_DAY.slice(5,7)-1]}</span>`:""}</div>
    <div class="times">${day.slots.map(s=>`<button class="time ${S.time===s.t?"on":""}" data-time="${s.t}" ${s.open?"":"disabled"} aria-label="${niceTime(s.t)}${s.open?"":" unavailable"}">${niceTime(s.t)}</button>`).join("")}</div>`}
function vTimes(){const day=S.date?dayInfo(S.date):null;if(!day||!day.open){S.step=1;return vPick()}
  return `<div class="pick"><div><b>${esc(niceDate(S.date,true))}</b><span>Pick a time below</span></div><button data-go="1">‹ Change day</button></div>
  <div class="card">
    <h2>2. Pick a time</h2>
    <div class="times">${day.slots.map(s=>`<button class="time ${S.time===s.t?"on":""}" data-time="${s.t}" ${s.open?"":"disabled"}>${niceTime(s.t)}<small>${s.open?"to "+niceTime(endTime(s.t)):s.blocked?"Unavailable":s.late?"Too soon":"Booked"}</small></button>`).join("")}</div>
  </div>
  <button class="btn" data-go="3" ${S.time&&day.slots.some(s=>s.t===S.time&&s.open)?"":"disabled"}>Next: your details</button>`}
function vForm(){const n=Math.max(1,S.nk||1);
  return `<div class="pick"><div><b>${esc(niceDate(S.date,true))} · ${esc(niceTime(S.time))}</b><span>20 minute gym tour</span></div><button data-go="1">Change</button></div>
  ${S.err?`<div class="err" role="alert">${esc(S.err)}</div>`:""}
  <form class="card" id="form" novalidate>
    ${Array.from({length:n},(_,i)=>`<label class="f kid"><span>${n>1?`Child ${i+1} full name`:"Child's full name"}</span><span class="kidrow"><input ${i===0?'id="f-first"':""} name="kid${i}" autocomplete="off" maxlength="80" placeholder="First and last name">${i>0?`<button type="button" class="kidx" data-rmkid="${i}" aria-label="Remove child ${i+1}">✕</button>`:""}</span></label>`).join("")}
    ${n<6?`<button type="button" class="addkid" data-addkid>＋ Add another child</button>`:""}
    <label class="f"><span>Parent or guardian name</span><input name="parentName" autocomplete="name" required maxlength="80"></label>
    <div class="row2"><label class="f"><span>Mobile</span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" required maxlength="20"></label>
    <label class="f"><span>Email</span><input name="email" type="email" autocomplete="email" required maxlength="120"></label></div>
    <label class="f"><span>Questions <i>(optional)</i></span><input name="notes" maxlength="1000"></label>
    <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button class="btn" type="submit" ${S.busy?"disabled":""}>${S.busy?"Booking…":"Book my tour"}</button>
  </form>`}
function vDone(){const b=S.done,start=b.at,end=b.at+TOUR_MINS*6e4;
  const z=ms=>new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const where=GYM.address||GYM.name;
  const g=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("EOD Allstars gym tour")}&dates=${z(start)}/${z(end)}&details=${encodeURIComponent(`Gym tour for ${b.kids.join(", ")}`)}&location=${encodeURIComponent(where)}`;
  return `<div class="card done">
    <div class="tick">✓</div>
    <h1><span>You're</span> <span>booked</span></h1>
    <p class="lead" style="margin:0">We can't wait to meet ${esc(kidFirsts(b.kids))}.</p>
    <div class="sum">
      <div><span>Day</span><b>${esc(niceDate(b.date,true))}</b></div>
      <div><span>Time</span><b>${esc(niceTime(b.time))} to ${esc(niceTime(endTime(b.time)))}</b></div>
      <div><span>${b.kids.length>1?"Children":"Child"}</span><b>${b.kids.map(esc).join("<br>")}</b></div>
      ${GYM.address?`<div><span>Where</span><b>${esc(GYM.address)}</b></div>`:""}
    </div>
    <div class="cal"><a href="${g}" target="_blank" rel="noopener">Google Calendar</a><button data-ics>Apple / Outlook</button></div>
    <p class="note">Please arrive a few minutes early. ${GYM.phone||GYM.email?`If you need to change or cancel, ${GYM.phone?`call ${esc(GYM.phone)}`:""}${GYM.phone&&GYM.email?" or ":""}${GYM.email?`email ${esc(GYM.email)}`:""}.`:"If you need to change or cancel, please let us know."}</p>
  </div>
  <button class="btn ghost" data-again>Book another tour</button>`}

/* ---------- confirmation email ---------- */
async function sendEmail(t){if(!EMAILJS.publicKey||!EMAILJS.serviceId||!EMAILJS.templateId)return;
  try{if(!window.emailjs){await new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
    await emailjs.send(EMAILJS.serviceId,EMAILJS.templateId,{to_email:t.email,parent_name:t.parentName,children:t.kids.join(", "),child_first_names:kidFirsts(t.kids),
      tour_day:niceDate(t.date,true),tour_time:`${niceTime(t.time)} to ${niceTime(endTime(t.time))}`,parent_phone:t.phone,notes:t.notes||"",
      gym_address:GYM.address,gym_phone:GYM.phone,gym_email:GYM.email},{publicKey:EMAILJS.publicKey})}
  catch(e){console.warn("Email not sent",e)}}

/* ---------- form helpers ---------- */
function collect(){const fm=$("#form");if(!fm)return;const o={};new FormData(fm).forEach((v,k)=>o[k]=String(v).trim());S.f=o}
function kidsOf(o){return Array.from({length:Math.max(1,S.nk||1)},(_,i)=>(o["kid"+i]||"").replace(/\s+/g," ").trim()).filter(Boolean)}
function kidFirsts(k){const f=k.map(x=>x.split(" ")[0]);return f.length>1?f.slice(0,-1).join(", ")+" and "+f[f.length-1]:f[0]||""}
function restore(){const fm=$("#form");if(!fm)return;Object.entries(S.f).forEach(([k,v])=>{const els=fm.querySelectorAll(`[name="${k}"]`);els.forEach(el=>{if(el.type==="radio")el.checked=el.value===v;else el.value=v})})}
function validate(o){const miss=[];
  if(!o.kid0)miss.push("kid0");
  if(!o.parentName)miss.push("parentName");
  if(o.phone.replace(/\D/g,"").length<8)miss.push("phone");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email))miss.push("email");
  return miss}
async function submit(){
  collect();const o=S.f;
  if(o.website)return; // bot
  const miss=validate(o);
  document.querySelectorAll("#form .bad").forEach(e=>e.classList.remove("bad"));
  if(miss.length){miss.forEach(n=>{const el=document.querySelector(`#form [name="${n}"]`);el&&el.classList.add("bad")});
    S.err=miss.includes("email")&&miss.length===1?"Please check the email address.":miss.includes("phone")&&miss.length===1?"Please check the mobile number.":"Please fill in the highlighted fields.";
    const e=document.querySelector(".err");if(e)e.textContent=S.err;else{render();miss.forEach(n=>{const el=document.querySelector(`#form [name="${n}"]`);el&&el.classList.add("bad")})}
    const first=document.querySelector("#form .bad");first&&first.focus();return}
  const k=keyOf(S.date,S.time),at=sydToMs(S.date,S.time);
  const cap=(s,n)=>String(s||"").slice(0,n);
  const tour={key:k,date:S.date,time:S.time,at,kids:kidsOf(o).map(x=>cap(x,80)).slice(0,6),
    parentName:cap(o.parentName,80),phone:cap(o.phone,20),email:cap(o.email.toLowerCase(),120),notes:cap(o.notes,1000),status:"booked",createdAt:Date.now()};
  S.busy=true;S.err="";render();
  try{await DB.book(k,tour);
    S.done=tour;S.busy=false;S.taken[k]={at};try{localStorage.setItem("eod_tour_booked",JSON.stringify({at,date:S.date,time:S.time,name:kidFirsts(tour.kids)}))}catch(e){}
    sendEmail(tour);
    render();window.scrollTo(0,0)}
  catch(e){S.busy=false;
    if(S.taken[k]||/permission|taken|exists/i.test(e.message||e.code||"")){S.err="Sorry, that time was just booked by someone else. Please pick another time.";S.taken[k]={at};S.step=1;S.time=null}
    else S.err="Something went wrong and your tour wasn't booked. Please check your connection and try again.";
    render();if(S.step===1&&S.err){alertBox()}window.scrollTo(0,0)}}
function alertBox(){const c=document.querySelector(".card");if(c)c.insertAdjacentHTML("beforebegin",`<div class="err" role="alert">${esc(S.err)}</div>`);S.err=""}
function ics(){const b=S.done,z=ms=>new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const txt=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//EOD Allstars//Tours//EN","BEGIN:VEVENT",`UID:${b.key}@eod-tours`,`DTSTAMP:${z(Date.now())}`,`DTSTART:${z(b.at)}`,`DTEND:${z(b.at+TOUR_MINS*6e4)}`,
    "SUMMARY:EOD Allstars gym tour",`DESCRIPTION:Gym tour for ${b.kids.join("\\, ")}`,`LOCATION:${(GYM.address||GYM.name).replace(/,/g,"\\,")}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download="eod-gym-tour.ics";document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.day){S.date=t.dataset.day;S.time=null;render();return}
  if(t.dataset.month){let [y,m]=S.month.split("-").map(Number);m+=+t.dataset.month;if(m<1){m=12;y--}if(m>12){m=1;y++}S.month=`${y}-${pad(m)}`;
    S.date=null;S.time=null;render();return}
  if(t.dataset.time){S.time=t.dataset.time;render();return}
  if(t.dataset.go){if(S.step===3)collect();S.step=+t.dataset.go;S.err="";render();window.scrollTo(0,0);return}
  if(t.hasAttribute("data-ics")){ics();return}
  if(t.hasAttribute("data-addkid")){collect();S.nk=Math.min(6,(S.nk||1)+1);render();const el=document.querySelector(`[name="kid${S.nk-1}"]`);el&&el.focus();return}
  if(t.dataset.rmkid){collect();const r=+t.dataset.rmkid,n=S.nk||1;for(let i=r;i<n-1;i++)S.f["kid"+i]=S.f["kid"+(i+1)]||"";delete S.f["kid"+(n-1)];S.nk=n-1;render();return}
  if(t.hasAttribute("data-again")){S.done=null;S.step=1;S.time=null;S.nk=1;S.month=null;try{const b=JSON.parse(localStorage.getItem("eod_tour_booked")||"null");if(b)S.prev=b}catch(e){}render();window.scrollTo(0,0)}});
document.addEventListener("submit",e=>{e.preventDefault();if(!S.busy)submit()});
document.addEventListener("input",e=>{if(e.target.classList.contains("bad"))e.target.classList.remove("bad");if(!document.querySelector("#form .bad")){const er=document.querySelector(".err");if(er){er.remove();S.err=""}}});

DB.listen(slots=>{S.taken=slots;S.loaded=true;
  if(S.step===3&&S.time&&slots[keyOf(S.date,S.time)]&&!S.busy&&!S.done){collect();S.err="Sorry, that time was just booked by someone else. Please pick another time.";S.step=1;S.time=null;render();alertBox();return}
  if(S.step===3||S.done)return;render()},
  ()=>{S.loaded=true;S.err="";$("#app").innerHTML=`<div class="card"><h2>Couldn't load tour times</h2><p class="help">Please check your connection and refresh the page.</p></div>`});
</script>
</body>
</html>
