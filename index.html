<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f2f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EOD Tryouts">
<title>EOD Tryout Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ========= EOD TRYOUT HUB · look based on the Pink Assassins poster =========
   Satin white ground, soft pink + grey boxes, black wide display type, hot pink accents. */
:root{
  color-scheme:light;
  --ok:#1f9d55; --okbg:#e3f5ea; --bad:#d23b3b; --badbg:#fbe5e5;
  --bg:#f4f2f4; --ink:#141214; --txt:#141214; --mut:#6f6870; --line:#dcd6db;
  --card:#ecebe9; --card2:#ffffff; --white:#ffffff;
  --pinkbox:#e8a4d3; --pinkpale:#fbe6f3; --pink:#d6409a; --pink2:#b22a7b;
  --teal:#d6409a; --gold:#141214; --red:#8a8288;
  --shadow:0 2px 12px rgba(90,40,75,.08);
  --disp:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --num:"Anton","Impact","Arial Narrow",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
html{background:var(--bg)}
body{min-height:100vh;background:
  radial-gradient(120% 60% at 15% 10%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),
  radial-gradient(90% 50% at 90% 35%,rgba(225,222,228,.9),rgba(225,222,228,0) 65%),
  radial-gradient(110% 55% at 10% 70%,rgba(232,229,234,.85),rgba(232,229,234,0) 60%),
  linear-gradient(135deg,#ffffff 0%,#ebe9ed 22%,#fdfdfd 40%,#e6e3e8 58%,#fafafb 76%,#e9e7ea 100%);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.disp,.logo,.ttl,.cat-h,.sect,.hub,.tabs button,.btn,.tool,.badge,.num,.qa-h h3,.lvlhead,.lvlcard h4,.mbox h3{font-family:var(--disp);font-stretch:125%;text-transform:uppercase}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;padding-top:env(safe-area-inset-top)}
.sparkle{position:absolute;color:var(--pink);opacity:.55;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;gap:10px}
.logo{font-weight:900;font-size:17px;letter-spacing:.03em;color:var(--ink)}
.logo span{color:var(--pink)}
.sub{color:var(--mut);font-size:12px}
.icon{min-width:40px;height:40px;border-radius:12px;background:var(--white);display:grid;place-items:center;font-size:16px;border:1px solid var(--line);padding:0 8px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:54px;width:auto;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 18px 12px}
.stat{background:var(--card);border-radius:14px;padding:8px 10px 10px;text-align:center}
.stat b{display:block;font-family:var(--num);font-weight:400;font-size:40px;line-height:1.05;color:var(--pinkbox)}
.stat small{font-family:var(--disp);font-stretch:125%;text-transform:uppercase;font-weight:800;font-size:9.5px;letter-spacing:.06em;color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 18px 12px}
.tool{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:10px;font-weight:800;letter-spacing:.03em;text-align:center;box-shadow:var(--shadow)}
.tool.on{background:var(--pinkbox);border-color:var(--pinkbox)}
.search{display:block;width:calc(100% - 36px);margin:0 18px 10px;background:var(--white);border-radius:12px;padding:11px 14px;font-size:16px;border:1px solid var(--line);outline:none}
.search:focus{border-color:var(--pink)}
.chips{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--white);color:var(--ink);white-space:nowrap;border:1px solid var(--line);flex:none}
.chip.on{background:var(--pinkbox);border-color:var(--pinkbox);color:var(--ink)}
.chip.gold.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px}
.tile{background:var(--white);border-radius:18px;padding:9px;border:1px solid var(--line);position:relative;text-align:left;width:100%;box-shadow:var(--shadow)}
.tile.sel{border:2px solid var(--pink);box-shadow:0 0 0 3px rgba(214,64,154,.18)}
.ph{height:128px;border-radius:12px;display:grid;place-items:center;font-size:32px;font-weight:800;color:#fff;position:relative;overflow:hidden;font-family:var(--disp);font-stretch:125%}
.ph img,.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.num{position:absolute;top:6px;left:6px;background:rgba(20,18,20,.75);color:#fff;font-size:10px;padding:3px 7px;border-radius:8px;font-weight:800;z-index:2}
.tile h4{font-size:13.5px;font-weight:800;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile p{font-size:11px;color:var(--mut)}
.badge{position:absolute;top:15px;right:15px;font-size:8px;letter-spacing:.04em;padding:4px 7px;border-radius:8px;font-weight:800;z-index:2}
.tile{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.ph .badge{top:auto;bottom:7px;left:7px;right:7px;text-align:center;padding:5px 4px;font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-assess{background:var(--bad);color:#fff}
.b-suggest,.b-approve{background:#f08a24;color:#fff}
.b-complete{background:var(--ok);color:#fff}
.tag.st-assess{background:var(--bad);border-color:var(--bad);color:#fff}
.tag.st-suggest,.tag.st-approve{background:#f08a24;border-color:#f08a24;color:#fff}
.tag.st-complete{background:var(--ok);border-color:var(--ok);color:#fff}
.stats.four{grid-template-columns:repeat(4,1fr);gap:6px}
.stats.four .stat{padding:8px 4px 9px;border:2px solid transparent;cursor:pointer}
.stats.four .stat.on{border-color:var(--ink)}
.stats.four .stat b{font-size:34px}
.stats.four .stat small{font-size:8px;letter-spacing:.03em;line-height:1.25;display:block}
.chip.st-assess.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.st-suggest.on,.chip.st-approve.on{background:#f08a24;border-color:#f08a24;color:#fff}
.chip.st-complete.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tile .ph{height:auto;aspect-ratio:2/3;max-width:100%}
.check{position:absolute;bottom:62px;right:16px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;z-index:3}
.tile.sel .check{background:var(--pink);border-color:var(--pink);color:#fff}
.g0{background:linear-gradient(135deg,#f0b8dc,#d6409a)}.g1{background:linear-gradient(135deg,#c9c4c8,#8d878c)}
.g2{background:linear-gradient(135deg,#3a3539,#141214)}.g3{background:linear-gradient(135deg,#f6cfe7,#e195c6)}
.g4{background:linear-gradient(135deg,#d6409a,#3a2333)}.g5{background:linear-gradient(135deg,#dcd7db,#e8a4d3)}
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:max(22px,calc(50% - 238px));width:60px;height:60px;border-radius:20px;background:var(--pink);display:grid;place-items:center;font-size:32px;color:#fff;box-shadow:0 8px 24px rgba(214,64,154,.4);z-index:20}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:20}
.bottombar>*{max-width:240px;flex:1}
.empty{text-align:center;color:var(--mut);padding:40px 30px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px;font-family:var(--disp);font-stretch:125%;text-transform:uppercase;font-weight:900}
/* profile */
.hero{position:relative;height:160px;overflow:visible;
  background:radial-gradient(70% 90% at 50% 45%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),linear-gradient(135deg,#f3f1f2 0%,#e6e3e4 30%,#f7f6f6 55%,#e3e0e1 80%,#efedee 100%);
  border-bottom:1px solid var(--line)}
.hero .hclip{position:absolute;inset:0;overflow:hidden}
.hy{position:absolute;bottom:4px;font-family:var(--num);font-size:clamp(120px,40vw,165px);line-height:1;color:var(--pinkbox);opacity:.85;pointer-events:none;z-index:0}
.hy1{left:-1vw}.hy2{right:-1vw}
.hlogo{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:min(54%,215px);z-index:1;filter:drop-shadow(0 8px 18px rgba(60,30,50,.35))}
.hero .back,.hero .edit{z-index:3}
.hero .back{position:absolute;top:16px;left:18px;background:rgba(255,255,255,.8);border:0}
.hero .edit{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.8);border:0}
.av{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);width:116px;height:116px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;overflow:hidden;box-shadow:var(--shadow);font-family:var(--disp);font-stretch:125%}
.cam{position:absolute;bottom:-44px;left:calc(50% + 30px);width:36px;height:36px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:15px;border:3px solid #fff;z-index:3}
.pname{text-align:center;margin-top:58px;padding:0 18px}
.pname h2{font-size:21px;font-weight:900;font-family:var(--disp);font-stretch:112%}
.pname p{font-size:12px;color:var(--mut)}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 18px 14px}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:10px;background:var(--white);border:1px solid var(--line)}
.tag.pk{background:var(--pinkbox);border-color:var(--pinkbox)}.tag.gd{background:var(--white)}.tag.tl{background:var(--pink);border-color:var(--pink);color:#fff}
.teamsel{background:var(--ink);border:1px solid var(--ink);color:#fff;border-radius:10px;font-size:16px;max-width:100%;padding:4px 8px;outline:none}
.tabs{display:flex;gap:2px;margin:0 18px 14px;background:var(--card);border-radius:14px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;text-align:center;font-size:10px;font-weight:800;letter-spacing:.03em;padding:10px 12px;border-radius:10px;color:var(--mut);white-space:nowrap}
.tabs .on{background:var(--pinkbox);color:var(--ink)}
.cat{background:var(--card);border-radius:16px;padding:14px;margin:0 18px 12px;position:relative}
.cat.pinkc{background:var(--pinkbox)}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:900;letter-spacing:.02em;margin-bottom:8px}
.cat-h span{color:var(--ink);opacity:.6;font-weight:700;font-size:10px;font-family:var(--body);font-stretch:100%;text-transform:none}
.bar{height:6px;background:rgba(255,255,255,.7);border-radius:4px;margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pink);border-radius:4px;transition:width .3s}
.pinkc .bar i{background:var(--ink)}
.sk{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:7px 0;border-top:1px solid rgba(20,18,20,.09)}
.sk .skn{min-width:0;line-height:1.3}
.seg{display:flex;gap:4px;flex:none}
.seg button{font-size:10px;font-weight:700;padding:6px 7px;border-radius:8px;background:rgba(255,255,255,.75);color:var(--mut)}
.seg .no.on{background:#cfc9ce;color:var(--ink)}.seg .wk.on{background:var(--pinkpale);color:var(--pink2);box-shadow:inset 0 0 0 1.5px var(--pink)}.seg .ys.on{background:var(--pink);color:#fff}
.pinkc .seg .ys.on{background:var(--ink);color:var(--pinkbox)}
.vb{display:flex;align-items:center;gap:3px;font-size:13px;padding:5px 7px!important;margin-left:2px}
.vb b{font-size:10px;color:var(--pink2)}
.vb.has{background:#fff!important;box-shadow:inset 0 0 0 1.5px var(--pink)}
.lvlhead{font-size:10px;font-weight:900;color:var(--pink2);letter-spacing:.05em;padding:12px 0 4px;border-top:1px solid rgba(20,18,20,.09)}
.pinkc .lvlhead{color:var(--ink)}
.lvlhead span{color:var(--mut);font-weight:600;text-transform:none;letter-spacing:0;font-family:var(--body);font-stretch:100%}
.lvlhead+.sk{border-top:0}
.info{margin:0 18px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:4px 14px;box-shadow:var(--shadow)}
.info .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.info .r:first-child{border-top:0}
.info .r span{color:var(--mut);flex:none}
.info .r b{font-weight:600;text-align:right;word-break:break-word}
.info .r a{color:var(--pink2);text-decoration:none}
.med{color:var(--pink2)!important}
/* videos */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.vth{height:110px;position:relative;display:grid;place-items:center;overflow:hidden}
.vth video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{width:38px;height:38px;border-radius:50%;background:rgba(20,18,20,.55);color:#fff;display:grid;place-items:center;font-size:13px;position:relative;z-index:2}
.dur{position:absolute;bottom:6px;right:6px;font-size:10px;background:rgba(20,18,20,.7);color:#fff;padding:1px 6px;border-radius:6px;z-index:2}
.upload{margin:12px 18px 0;border:2px dashed var(--pink);border-radius:16px;padding:16px;text-align:center;color:var(--pink2);font-size:14px;font-weight:800;width:calc(100% - 36px);display:block;background:rgba(255,255,255,.6)}
.upload small{display:block;color:var(--mut);font-weight:500;font-size:11px;margin-top:3px}
.vrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -14px 2px;padding:0 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vrow::-webkit-scrollbar{display:none}
.vcard{flex:0 0 74%;max-width:260px;scroll-snap-align:start;background:var(--white);border-radius:14px;overflow:hidden;text-align:left;padding:0;box-shadow:var(--shadow)}
.vcard .vth{height:150px}
.vcard .m{padding:8px 10px}
.vcard h5{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard p{font-size:10.5px;color:var(--mut)}
.vcard.up{display:flex;flex-direction:column;justify-content:center;padding:14px;font-size:12px;min-height:200px}
.vcount{font-size:11px;color:var(--ink);font-weight:700;margin-top:10px}
.cat:not(.pinkc) .vcount{color:var(--pink2)}
.lvlcard{background:var(--pinkpale);border:2px solid var(--pinkbox);border-radius:18px;padding:14px;margin:0 18px 12px}
.lvlcard h4{font-size:13px;font-weight:900;margin-bottom:4px}
.lvlcard .chips{padding:0;margin:8px 0 12px;flex-wrap:wrap}
.lvlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 18px 12px;font-size:12.5px;box-shadow:var(--shadow)}
.lvlbar b{color:var(--pink2)}
.lvlbar button{color:var(--pink2);font-weight:800;font-size:12px;padding:4px}
.cat.locked{opacity:.55}
.chk{list-style:none;margin:7px 0 2px;display:grid;gap:2px}
.chk li{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ink)}
.chk i{font-style:normal;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;flex:none}
.chk li.y i{background:var(--ok);color:#fff}
.chk li.n i{background:var(--badbg);color:var(--bad)}
.chk li.n{color:var(--mut)}
.tteam{color:var(--pink2)!important;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamchip{flex:none;max-width:46%;background:var(--white);border:1.5px solid var(--pink);color:var(--pink2);font-size:11px;font-weight:800;border-radius:10px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamchip.fin{background:var(--ok);border-color:var(--ok);color:#fff}
.teamchip.ghost{border-style:dashed}
.eh-b{display:flex;gap:4px;align-items:center;flex:none}
.dpill{font-size:10px!important;font-weight:800;text-decoration:none!important;background:rgba(255,255,255,.8);border-radius:8px;padding:3px 7px!important;color:var(--bad)}
.dpill.yes{background:var(--ok);color:#fff}
.donebar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:14px;padding:9px 10px 9px 12px;margin:0 18px 12px;font-size:12px;box-shadow:var(--shadow)}
.donebar.yes{border-left-color:var(--ok)}
.donebar span{min-width:0;color:var(--mut)}.donebar b{color:var(--ink)}
.donebtn{flex:none;font-family:var(--disp);font-stretch:118%;text-transform:uppercase;font-weight:900;font-size:10px;letter-spacing:.03em;border-radius:10px;padding:9px 11px;background:var(--badbg);color:var(--bad)}
.donebtn.yes{background:var(--ok);color:#fff}
.donechoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfbtns{display:grid;gap:8px}
.cfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;background:var(--okbg);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:12.5px;color:var(--ok)}
.cfoot b{color:var(--ink)}.cfoot .linkbtn{margin:0;padding:2px;color:var(--mut)}
.btn.cbtn.cdone{border-color:var(--ok);color:var(--ok)}
.chip.dim{opacity:.45}
.topbtns{display:flex;gap:8px;align-items:center;flex:none}
.hubbtn{position:relative;background:var(--ink);color:#fff;font-family:var(--disp);font-stretch:118%;text-transform:uppercase;font-weight:900;font-size:10px;letter-spacing:.03em;border-radius:12px;padding:12px 10px;white-space:nowrap}
.hubbtn i{position:absolute;top:-7px;right:-7px;background:var(--pink);color:#fff;font-style:normal;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.tools.four{grid-template-columns:repeat(4,1fr);gap:6px}.tools.four .tool{font-size:9px;padding:10px 2px}
.searchrow{display:flex;gap:8px;margin:0 18px 10px}.searchrow .search{margin:0;width:auto;flex:1;min-width:0}
.sortsel{flex:none;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px;font-weight:600;max-width:42%;appearance:none;-webkit-appearance:none}
.thumb{display:inline-grid;place-items:center;border-radius:8px;overflow:hidden;position:relative;flex:none;color:#fff;font-weight:800;font-size:11px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.boardwrap,.hubwrap{padding:0 18px}
.tgl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:14px}
.bsh{font-family:var(--disp);font-stretch:125%;text-transform:uppercase;font-weight:900;font-size:16px;margin:8px 0 2px}
.btier{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pink2);margin:14px 0 8px}
.bgrid{display:grid;grid-template-columns:1fr;gap:10px}
.bteam{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.bteam.empty{opacity:.6;box-shadow:none}
.bth{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bth b{display:block;font-family:var(--disp);font-stretch:118%;text-transform:uppercase;font-weight:900;font-size:13px}
.bth span{font-size:11px;color:var(--mut)}
.bth em{font-style:normal;font-family:var(--num);font-size:28px;line-height:1;color:var(--pinkbox)}
.bcnt{display:flex;gap:6px;margin:6px 0}

function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await loadImg(url);
    const sc=Math.min(1,PHOTO_MAX_PX/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  }finally{URL.revokeObjectURL(url)}
}
function videoDuration(file){
  return new Promise(res=>{
    const v=document.createElement("video");v.preload="metadata";v.muted=true;
    const done=d=>{URL.revokeObjectURL(v.src);res(d)};
    v.onloadedmetadata=()=>done(v.duration);v.onerror=()=>done(0);
    setTimeout(()=>done(0),8000);
    v.src=URL.createObjectURL(file);
  });
}

/* ======================= BACKEND: FIREBASE ======================= */
function FirebaseBackend(){
  let fb,db,st,auth,unA,unS,unC;
  const ref=id=>db.collection(String(id).startsWith("c_")?"current":"athletes").doc(id);
  const V="10.12.2",base=`https://www.gstatic.com/firebasejs/${V}/`;
  return {
    async init(){
      for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js","firebase-storage-compat.js"])await loadScript(base+f);
      fb=window.firebase;fb.initializeApp(FIREBASE_CONFIG);
      auth=fb.auth();db=fb.firestore();st=fb.storage();
      try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    },
    onAuth(cb){auth.onAuthStateChanged(u=>cb(u?{email:u.email,uid:u.uid}:null))},
    signIn(e,p){return auth.signInWithEmailAndPassword(e,p)},
    signOut(){return auth.signOut()},
    resetPassword(e){return auth.sendPasswordResetEmail(e)},
    listen(onA,onS,onC){
      unC=db.collection("current").onSnapshot(s=>onC(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast("Sync error: "+e.message));
      unA=db.collection("athletes").onSnapshot(s=>onA(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast("Sync error: "+e.message));
      unS=db.doc("config/settings").onSnapshot(d=>onS(d.exists?d.data():null),e=>toast("Sync error: "+e.message));
    },
    unlisten(){unA&&unA();unS&&unS();unC&&unC()},
    newId(){return db.collection("athletes").doc().id},
    newCurId(){return "c_"+db.collection("current").doc().id},
    createCurrent(id,data){return ref(id).set({...data,stars:{},notes:[],videos:[],reports:{},createdAt:Date.now()})},
    async createAthlete(id,data){
      const sref=db.doc("config/settings"),aref=db.collection("athletes").doc(id);
      await db.runTransaction(async t=>{
        const s=await t.get(sref);const n=((s.exists&&s.data().counter)||0)+1;
        t.set(sref,{counter:n},{merge:true});
        t.set(aref,{...data,num:n,skills:{},notes:[],videos:[],createdAt:Date.now()});
      });
    },
    updateAthlete(id,patch){return ref(id).update(patch)},
    setField(id,path,v){const FP=fb.firestore.FieldPath,FV=fb.firestore.FieldValue;return ref(id).update(new FP(...path),v==null?FV.delete():v)},
    setRating(id,key,v){
      const FP=fb.firestore.FieldPath,FV=fb.firestore.FieldValue;
      return ref(id).update(new FP("skills",key),v==null?FV.delete():v);
    },
    addToList(id,field,item){return ref(id).update({[field]:fb.firestore.FieldValue.arrayUnion(item)})},
    removeFromList(id,field,item){return ref(id).update({[field]:fb.firestore.FieldValue.arrayRemove(item)})},
    uploadFile(path,blob,onP){
      return new Promise((res,rej)=>{
        const task=st.ref(path).put(blob,{contentType:blob.type||guessType(path)});
        task.on("state_changed",s=>onP&&onP(s.bytesTransferred/s.totalBytes*100),rej,async()=>{try{res(await task.snapshot.ref.getDownloadURL())}catch(e){rej(e)}});
      });
    },
    async deleteFile(path){if(!path)return;try{await st.ref(path).delete()}catch(e){}},
    deleteDoc(id){return ref(id).delete()},
    async deleteAthlete(a){
      for(const v of a.videos||[])await this.deleteFile(v.path);
      await this.deleteFile(a.photoPath);
      await ref(a.id).delete();
    },
    saveSettings(patch){return db.doc("config/settings").set(patch,{merge:true})},
    setSetting(path,v){const FP=fb.firestore.FieldPath,FV=fb.firestore.FieldValue;return db.doc("config/settings").update(new FP(...path),v==null?FV.delete():v)}
  };
}

          else res(URL.createObjectURL(blob));}},150);

function sorter(k){const n=(a,b)=>(a.num||0)-(b.num||0);
  if(k==="first")return (a,b)=>(a.first||"").localeCompare(b.first||"")||n(a,b);
  if(k==="last")return (a,b)=>(a.last||"").localeCompare(b.last||"")||(a.first||"").localeCompare(b.first||"");
  if(k==="age")return (a,b)=>((a.dob?divAge(a.dob):99)-(b.dob?divAge(b.dob):99))||n(a,b);
  if(k==="status")return (a,b)=>STATUS_ORDER.indexOf(statusOf(a))-STATUS_ORDER.indexOf(statusOf(b))||n(a,b);
  return n}
function filtered(){

function tSkills(a){
  const s=a.skills||{},cs=cats();
  if(!cs.length)return `<div class="empty">No skills set up yet. Add them in Settings.</div>`;
  const leveled=c=>c.items.some(i=>i.level);
  const anyLev=cs.some(leveled);
  const picking=anyLev&&(!hasLevels(a)||(S.lvl&&S.lvl.id===a.id));
  const vids=(a.videos||[]).slice().sort((x,y)=>y.at-x.at);
  const catNames=cs.map(c=>c.cat);
  let out=`<div class="notecard"><div class="cat-h">Cheer notes<span>saves when you tap away</span></div>
    <textarea class="in" id="n-cheer" data-keep data-save="cheerSkillNotes" placeholder="General notes on ${esc(a.first||"this athlete")}'s cheer skills">${esc(a.cheerSkillNotes||"")}</textarea></div>`;

  out+=`<div class="skillcols">`;
  let ci=0;
  out+=cs.map(c=>{const pc=(ci++%2===0)?" pinkc":"";
    const catVids=vids.filter(v=>skillCat(v.skill)===c.cat);
    if(leveled(c)&&!hasLevels(a))return `<div class="cat locked${pc}"><div class="cat-h">${esc(c.cat)}<span>Pick levels above</span></div>${vidRow(a,catVids,k=>skillCat(k)===c.cat)}</div>`;
    const items=c.items.filter(i=>canSee(a,i)).sort((x,y)=>(x.level||0)-(y.level||0));
    const has=items.filter(i=>tickOf(a,i.key)).length;
    let lastLvl=null,rows="";
    items.forEach(i=>{
      if(i.level&&i.level!==lastLvl){
        const tag=i.level===lvlSkills(a.tumbleMain)?"main":(i.level===lvlSkills(a.tumbleSecond)?"secondary":"");
        rows+=`<div class="lvlhead">${lvlName(i.level)} ${tag?`<span>· ${tag}</span>`:""}</div>`;lastLvl=i.level;
      }
      rows+=skRow2(a,i.key,i.name,vids,isFlex(i.key));
    });
    return `<div class="cat${pc}"><div class="cat-h">${esc(c.cat)}<span>${has} of ${items.length}</span></div>
      <div class="bar"><i style="width:${items.length?has/items.length*100:0}%"></i></div>

  String(v||"").split(/[,;\/\n&+]| and /i).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    const hit=known.filter(k=>new RegExp("\\b"+k.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(part)).sort((x,y)=>y.name.length-x.name.length)[0];
    const t=hit?{team:hit.name,sub:hit.sub||""}:{team:part,sub:""};if(!out.some(o=>o.team===t.team))out.push(t)});
  return out}

/* ---------- ticks + tech scores (current athletes) ---------- */
const TECH_GUIDE=[[1,"Developing","d"],[3,"Some technical errors","s"],[5,"Excellent","e"]];
function techLabel(v){return v==null?"":v<2?"Developing":v<4?"Some technical errors":"Excellent"}
function techCls(v){return v==null?"":v<2?"d":v<4?"s":"e"}
function tickOf(a,k){return !!(a.ticks||{})[k]||(!isCur(a)&&(a.skills||{})[k]===2)}
function techOf(a,k){const t=(a.tech||{})[k];if(t!=null)return +t;const s=(a.stars||{})[k];return s?+s:null}
function itemLevel(k){const i=skillList().find(x=>x.key===k);return i?i.level:null}
function levelPatch(a,k){if(!isCur(a))return null;const l=itemLevel(k),cur=curLevels(a);return l&&!cur.includes(l)?{levels:[...cur,l].sort((x,y)=>x-y)}:null}
async function setTick(a,k,on){const lp=on?levelPatch(a,k):null;
  try{await B.setField(a.id,["ticks",k],on?true:null);if(!isCur(a)&&(on||(a.skills||{})[k]!=null))await B.setRating(a.id,k,on?2:null);if(lp)await B.updateAthlete(a.id,lp)}catch(e){toast("Couldn't save: "+e.message)}}
async function setTech(a,k,v){const lp=levelPatch(a,k);
  try{await B.setField(a.id,["tech",k],v==null?null:Math.round(v*10)/10);if(v==null&&(a.stars||{})[k])await B.setField(a.id,["stars",k],null);if(lp)await B.updateAthlete(a.id,lp)}catch(e){toast("Couldn't save: "+e.message)}}
function levelItems(l,catNames){return cats().filter(c=>!catNames||catNames.includes(c.cat)).flatMap(c=>c.items.filter(i=>i.level===l))}
function levelProg(a,l){const it=levelItems(l),ts=it.map(i=>techOf(a,i.key)).filter(v=>v!=null);
  return {total:it.length,ticked:it.filter(i=>tickOf(a,i.key)).length,scored:ts.length,tech:ts.length?ts.reduce((x,y)=>x+y,0)/ts.length:null}}
function flyProg(a){const fl=flyerList(),ts=fl.map(n=>techOf(a,"Flyer|"+n)).filter(v=>v!=null);
  return {total:fl.length,ticked:fl.filter(n=>tickOf(a,"Flyer|"+n)).length,scored:ts.length,tech:ts.length?ts.reduce((x,y)=>x+y,0)/ts.length:null}}
function ringSvg(frac,col,bg){const C=2*Math.PI*40;frac=Math.max(0,Math.min(1,frac||0));
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="${bg}" stroke-width="13"/>${frac>0?`<circle cx="50" cy="50" r="40" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C*frac} ${C}" transform="rotate(-90 50 50)"/>`:""}</svg>`}
function progCard(a){
  const rows=CUR_LEVELS.map(l=>({n:lvlName(l),p:levelProg(a,l)})).filter(x=>x.p.total);
  if(a.flyerAssess||flyProg(a).ticked||flyProg(a).scored)rows.push({n:"Flyer",p:flyProg(a)});
  return `<div class="pgcard"><div class="cat-h">Progress<span>skills ticked · tech average</span></div>${rows.map(({n,p})=>{const st=p.ticked||p.scored;
    return `<div class="pgrow ${st?"":"off"}"><div class="pgn">${esc(n)}${st?"":"<small>Not started</small>"}</div><div class="pgpair">
      <div class="pgr">${ringSvg(p.ticked/p.total,"#d6409a","#f6dcec")}<div><b>${p.ticked}/${p.total}</b><span>Skills</span></div></div>
      <div class="pgr">${ringSvg((p.tech||0)/5,"#141214","#e6e2e5")}<div><b>${p.tech!=null?p.tech.toFixed(1):"–"}</b><span>Tech${p.scored?` · ${p.scored} scored`:""}</span></div></div></div></div>`}).join("")}</div>`}
function miniRings(a){
  const rows=CUR_LEVELS.map(l=>({n:lvlShort(l),p:levelProg(a,l)})).filter(x=>x.p.total&&(x.p.ticked||x.p.scored));

function skRow2(a,key,name,vids,photo){const n=vids.filter(x=>x.skill===key&&!isPhoto(x)).length,np=vids.filter(x=>x.skill===key&&isPhoto(x)).length,k=esc(key),tk=tickOf(a,key),t=techOf(a,key);

    ${photo?`<button class="vb ${np?"has":""}" data-act="skillPhoto" data-k="${k}" aria-label="Add photo of ${esc(name)}">📷${np?`<b>${np}</b>`:""}</button>`:""}
    <button class="vb ${n?"has":""}" data-act="cFilm" data-id="${a.id}" data-k="${k}" aria-label="Add video of ${esc(name)}">🎥${n?`<b>${n}</b>`:""}</button></div></div>`}
function tCurAssess(a){
  const lv=curLevels(a),vids=(a.videos||[]).slice().sort((x,y)=>y.at-x.at);
  let out=assessBar(a)+progCard(a)+`<div class="cat clv"><div class="cat-h">Tumbling levels<span>tick all that apply</span></div>
    <div class="lvgrid">${CUR_LEVELS.map(l=>{const on=lv.includes(l);return `<button class="cb ${on?"on":""}" data-act="cLvl" data-v="${l}"><i>${on?"✓":""}</i>${lvlName(l)}</button>`}).join("")}</div>
    <button class="flyt" data-act="cFly"><span>Assess as a flyer<small>${a.flyerAssess?"Body positions are showing below":"Adds body positions to assess"}</small></span><i class="sw ${a.flyerAssess?"":"off"}"></i></button></div><div class="skillcols">`;

    items.forEach(i=>{if(i.level!==last){rows+=`<div class="lvlhead">${lvlName(i.level)}</div>`;last=i.level}rows+=skRow2(a,i.key,i.name,vids,false)});
    out+=`<div class="cat${ci%2?" pinkc":""}"><div class="cat-h">${esc(c.cat)}<span>${done} of ${items.length} ticked</span></div><div class="bar"><i style="width:${done/items.length*100}%"></i></div>${rows}${vidRow(a,vids.filter(v=>skillCat(v.skill)===c.cat),k=>skillCat(k)===c.cat)}</div>`});
  if(a.flyerAssess){const fl=flyerList(),done=fl.filter(n=>tickOf(a,"Flyer|"+n)).length,fv=vids.filter(v=>v.skill===FLY_VIDS);
    out+=`<div class="cat pinkc"><div class="cat-h">Flyer body positions<span>${done} of ${fl.length} ticked</span></div><div class="bar"><i style="width:${fl.length?done/fl.length*100:0}%"></i></div>
      ${fl.map(n=>skRow2(a,"Flyer|"+n,n,vids,true)).join("")}${vidRow(a,vids.filter(v=>skillCat(v.skill)==="Flyer"),k=>skillCat(k)==="Flyer")}</div>
    <div class="cat"><div class="cat-h">Stunting / flying videos<span>${fv.length?fv.length+" saved":""}</span></div><div class="sub">Extra clips of full stunt sequences, pyramids or baskets.</div>
      ${vidRow(a,fv,k=>k===FLY_VIDS)}
      <button class="upload" data-act="skillVid" data-k="${esc(FLY_VIDS)}" style="width:100%;margin:12px 0 0">＋ Add stunting / flying video<small>Max ${MAX_VIDEO_SECONDS} sec</small></button></div>`}
  return out+`</div><p class="help" style="text-align:center;margin:8px 30px 0">✓ ticks a skill. Score gives a tech score out of 5. 🎥 films it and lets you score straight after.</p>`;
}

async function vcCheckFile(f){
  if(f.size>MAX_VIDEO_MB*1024*1024){toast(`That clip is over ${MAX_VIDEO_MB}MB, probably filmed in 4K. Trim it, or set the camera to 1080p.`);return false}
  const dur=await videoDuration(f);if(dur>MAX_VIDEO_SECONDS+1){toast(`That clip is ${Math.round(dur)} sec. Trim it to ${MAX_VIDEO_SECONDS} sec or less first.`);return false}
  return true}

function parseTeamsText(txt){const out={sport:[],novice:[],elite:[]};let cur=null,bad=[];
  txt.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    if(l.startsWith("#")){const n=l.replace(/^#+/,"").trim().toLowerCase();cur=/star|sport/.test(n)?"sport":/novice/.test(n)?"novice":/prem|elite/.test(n)?"elite":null;if(!cur)bad.push(l);return}
    if(!cur){bad.push(l);return}

  return {teams:out,bad}}

/* ---------- season rollover ---------- */
function rollPlan(){

  const curMove=S.current.filter(a=>fin(a).length),curStay=S.current.filter(a=>!fin(a).length);
  const tryMove=S.athletes.filter(a=>fin(a).length),tryStay=S.athletes.filter(a=>!fin(a).length);
  return {fin,tierOf,curMove,curStay,tryMove,tryStay}}
function vRollover(){
  if(!isDirector())return vHome();
  const p=rollPlan(),R=S.roll;
  const li=arr=>arr.slice(0,60).map(a=>`<li>${esc(fullName(a))}${p.fin(a).length?` → <b>${esc(p.fin(a).map(teamLbl).join(" / "))}</b>`:""}</li>`).join("")+(arr.length>60?`<li>…and ${arr.length-60} more</li>`:"");

async function runRollover(){
  const p=rollPlan(),list=[...p.curMove,...p.tryMove];S.roll={busy:true,done:0,total:list.length};render();let fail=0;
  for(const a of list){
    try{const fin=p.fin(a),teams=fin.map(e=>({team:e.team,sub:e.sub||""})),t=p.tierOf(teams),tier=t?t.cur:(a.tier||"");
      if(isCur(a)){await B.updateAthlete(a.id,{curTeams:teams,tier,prevTeams:a.curTeams||[],placement:{},team:"",done:{},reports:{},rolledAt:Date.now()})}
      else{const id=B.newCurId();
        const keep=["first","last","dob","parentName","parentPhone","parentEmail","medical","photoURL","photoPath","cnum","pcode","prevGym","experience"];
        const d={tryoutType:"cheer",curTeams:teams,tier,positions:(a.cheerPositions||[]).filter(x=>CUR_POS.includes(x)),fromTryout:a.num||null,rolledAt:Date.now()};
        keep.forEach(k=>{if(a[k]!=null&&a[k]!=="")d[k]=a[k]});
        d.pos=d.positions.includes("Flyer")?"flyer":d.positions.length?"base":"";d.flyerAssess=d.positions.includes("Flyer");
        const lv=[a.tumbleMain,a.tumbleSecond].map(x=>x==null||x===""?null:lvlSkills(+x)).filter(x=>x&&x>0);d.levels=[...new Set(lv)];
        await B.createCurrent(id,d);
        const ticks={...(a.ticks||{})};Object.entries(a.skills||{}).forEach(([k,v])=>{if(v===2)ticks[k]=true});
        await B.updateAthlete(id,{videos:a.videos||[],notes:a.notes||[],ticks,tech:a.tech||{}});
        await B.deleteDoc(a.id)}}
    catch(e){fail++}
    S.roll.done++;if(S.view==="rollover")render()}
  S.roll=null;toast(fail?`Rolled over ${list.length-fail}. ${fail} failed, try again.`:`Rollover done ✦ ${list.length} athletes updated`);S.mode="current";try{localStorage.setItem("eodth_mode","current")}catch(e){}go("home")}

const DIVMAX={Tiny:6,Mini:9,Youth:12,Junior:15,Senior:18,Open:99};
function teamInfo(name){for(const t of TIERS.cheer){const x=t.teams.find(y=>y.name===name);if(x)return {...x,tier:t.id}}return null}
function teamMax(name){const x=teamInfo(name);return x&&x.div&&DIVMAX[x.div]!=null?DIVMAX[x.div]:null}
function divFor(age){return AGE_GROUPS.find(g=>age<=DIVMAX[g])||"Open"}
function agesOut(a){if(!a||!a.dob)return [];const age=divAge(a.dob);return (a.curTeams||[]).filter(t=>{const m=teamMax(t.team);return m!=null&&age>m}).map(t=>t.team)}
function sugSelect(a){if(!isDirector()||!discsOf(a).includes("cheer"))return "";const cur=plist(a,"cheer").map(e=>e.team);
  return `<select class="sugsel" data-sug="${a.id}" aria-label="Suggest a 2027 team for ${esc(a.first||"")}"><option value="">＋ Suggest</option>${TIERS.cheer.map(t=>{const ts=t.teams.filter(x=>!a.dob||teamOk(a,"cheer",x)||cur.includes(x.name));return ts.length?`<optgroup label="${esc(t.name)}">${ts.map(x=>`<option value="${t.id}|${esc(x.name)}" ${cur.includes(x.name)?"disabled":""}>${cur.includes(x.name)?"✓ ":""}${esc(x.name)}${x.sub?` · ${esc(x.sub)}`:""}</option>`).join("")}</optgroup>`:""}).join("")}</select>`}
async function addSuggestion(a,d,tierId,name){const list=plist(a,d),k=tkey(name);if(list.some(e=>e.key===k))return;
  const tm=((TIERS[d].find(t=>t.id===tierId)||{teams:[]}).teams.find(x=>x.name===name))||{};
  const ne={key:k,tier:tierId,team:name,sub:tm.sub||"",by:coachName(),at:Date.now(),approvals:{}},extra={};
  if(discsOf(a).every(x=>x===d||plist(a,x).length)&&!doneOf(a,"teams"))extra["done.teams"]={by:coachName(),at:Date.now(),auto:true};
  try{const P=plc(a,d);
    if(P.team&&!P.teams)await savePlist(a,d,[...list,ne],extra);
    else{const {key,...rec}=ne;await B.setField(a.id,["placement",d,"teams",k],rec);if(extra["done.teams"])await B.setField(a.id,["done","teams"],extra["done.teams"])}
    toast(`Suggested ${name} for ${a.first||"athlete"}`)}catch(e){toast("Couldn't save: "+e.message)}}
function sugChips(a){const l=plist(a,"cheer");return l.length?`<span class="sgc">${l.map(e=>`<i class="${isFinal(e)?"ok":""}">${isFinal(e)?"✓ ":""}${esc(e.team)}</i>`).join("")}</span>`:""}
function bMatch(a){const q=(S.bq||"").trim().toLowerCase().replace(/^#/,"");return !q||(fullName(a)+" "+aCode(a)+" "+(a.num||"")).toLowerCase().includes(q)}
function vBoard(){
  const tab=S.btab||"all";
  const tabs=[["all","2027 placements"],["current","Current teams"],["new","New athletes"]];
  const body=tab==="current"?boardCurrent():boardPlace(tab==="new"?S.athletes:allAth(),tab);
  return `<div class="top"><button class="icon" data-act="go" data-v="home">‹</button><div class="logo" style="font-size:16px">Teams <span>board</span></div><span style="width:38px"></span></div>
  <div class="boardwrap">
    <div class="tabs btabs">${tabs.map(([k,t])=>`<button class="${tab===k?"on":""}" data-act="btab" data-v="${k}">${t}</button>`).join("")}</div>
    <input class="search bsearch" id="bsearch" placeholder="🔍  Search athlete name or code" value="${esc(S.bq||"")}" data-keep autocomplete="off">
    ${body}</div>`}
const POS_ORDER=["Flyer","Back spot","Main base","Secondary base","Base"];
function primaryPos(a){const l=posList(a);for(const p of POS_ORDER)if(l.includes(p))return p;return ""}
function posRank(a){const p=primaryPos(a);const i=POS_ORDER.indexOf(p);return i<0?9:i}
function posSort(x,y){return posRank(x.a)-posRank(y.a)||(x.a.last||"").localeCompare(y.a.last||"")||(x.a.first||"").localeCompare(y.a.first||"")}
async function setPrimaryPos(a,v){
  if(isCur(a)){const old=(a.positions&&a.positions.length)?a.positions:[];const n=v?[v,...old.filter(x=>x!==v&&x!=="Base")]:[];
    try{await B.updateAthlete(a.id,{positions:n,pos:n.includes("Flyer")?"flyer":n.length?"base":"",...(n.includes("Flyer")?{flyerAssess:true}:{})});toast(v?`${a.first||""}: ${v}`:"Position cleared")}catch(e){toast("Couldn't save: "+e.message)}}
  else{const old=(a.cheerPositions||[]).filter(x=>x!=="N/A");const n=v?[v,...old.filter(x=>x!==v)]:[];
    try{await B.updateAthlete(a.id,{cheerPositions:n});toast(v?`${a.first||""}: ${v}`:"Position cleared")}catch(e){toast("Couldn't save: "+e.message)}}}
function posSelect(a){const p=primaryPos(a);
  return `<select class="possel ${p==="Flyer"?"fly":""}" data-pos="${a.id}" aria-label="Position for ${esc(a.first||"")}"><option value="">Position…</option>${CUR_POS.map(x=>`<option value="${x}" ${p===x?"selected":""}>${x}</option>`).join("")}${p==="Base"?`<option value="Base" selected>Base (pick one)</option>`:""}</select>`}
function teamLevel(name){const ti=teamInfo(name);if(!ti)return null;const s=(ti.sub||"")+" "+name;if(/novice/i.test(s))return NOVICE;const m=s.match(/(\d)/);return m?+m[1]:null}
function placedTeams(src,d){const rows={};src.forEach(a=>discsOf(a).forEach(dd=>{if(dd!==d)return;plist(a,d).forEach(p=>{(rows[p.team]=rows[p.team]||[]).push({a,p,fin:isFinal(p)})})}));return rows}
function boardPlace(src,tab){
  const tagNew=tab!=="new";
  const sec=d=>{
    const rows=placedTeams(src.filter(bMatch),d),known=TIERS[d].flatMap(t=>t.teams.map(x=>({...x,tier:t.name})));
    const cols=[...known.filter(t=>rows[t.name]||(S.boardEmpty&&!S.bq)),...Object.keys(rows).filter(n=>!known.some(k=>k.name===n)).map(n=>({name:n,sub:"",tier:"Other"}))];
    const unsug=src.filter(a=>bMatch(a)&&discsOf(a).includes(d)&&!plist(a,d).length);
    let h=`<h3 class="bsh">${d==="cheer"?"Cheer":"Dance"} teams</h3>`;
    if(!cols.length&&!unsug.length)return "";
    h+=`<div class="tlwrap"><div class="tlcols">`+cols.map(t=>{const list=(rows[t.name]||[]).sort(posSort),f=list.filter(x=>x.fin).length,fly=list.filter(x=>primaryPos(x.a)==="Flyer").length;
      return `<div class="tlcol"><div class="tlh"><small>${esc(t.tier)}</small><b>${esc(t.name)}</b><span>${list.length} · ${d==="cheer"?`${fly} flyer${fly===1?"":"s"} · `:""}${f} final</span></div>
        ${list.map(x=>`<button class="tln ${d==="cheer"&&primaryPos(x.a)==="Flyer"?"fly":""} ${x.fin?"fin":""}" data-act="openTeams" data-id="${x.a.id}"><span>${esc(fullName(x.a))}</span>${tagNew&&!isCur(x.a)?`<i class="nw">new</i>`:""}${x.fin?`<i class="ok">✓</i>`:""}</button>`).join("")||`<p class="help" style="margin:6px 8px">No athletes</p>`}
      </div>`}).join("")+`</div></div>`;
    if(unsug.length)h+=`<div class="btier">Not suggested yet (${unsug.length})</div><div class="bunsug">${unsug.map(a=>`<div class="browx"><button class="brow" data-act="openTeams" data-id="${a.id}">${thumb(a,30)}<span class="bn"><b>${esc(fullName(a))}${isCur(a)?'<span class="curtag">Current</span>':""}</b><small>${a.dob?"Age "+divAge(a.dob)+" · "+esc(divLabel(a)):""}</small></span>${d==="cheer"&&isDirector()?"":`<i class="no">!</i>`}</button>${d==="cheer"?sugSelect(a):""}</div>`).join("")}</div>`;
    return h};
  const body=sec("cheer")+(tab==="new"||src.some(a=>discsOf(a).includes("dance"))?sec("dance"):"");
  return `<div class="tltop"><p class="help" style="margin:0">${tab==="new"?"Tryout athletes only. ":""}Suggested and final 2027 teams (✓ = final). Flyers are green and listed first, then back spots, main bases and secondary bases. Tap a name to open their team selection.</p>
      <button class="btn tsbtn" data-act="tsGo">📊 Team stats</button></div>
    ${S.bq?"":`<label class="tgl"><input type="checkbox" id="boardEmpty" ${S.boardEmpty?"checked":""}> Show teams with no athletes</label>`}
    ${body.trim()?body:`<div class="empty"><b>${S.bq?"No matches":"No placements yet"}</b>${S.bq?"Try a different name.":"Suggest teams from the Current teams tab or an athlete's Team selection."}</div>`}`}

/* ---------- Team stats ---------- */
function vTeamStats(){
  const rows=placedTeams(allAth(),"cheer"),names=TIERS.cheer.flatMap(t=>t.teams.map(x=>x.name)).filter(n=>rows[n]).concat(Object.keys(rows).filter(n=>!TIERS.cheer.some(t=>t.teams.some(x=>x.name===n))));
  if(!S.tsTeam||!names.includes(S.tsTeam))S.tsTeam=names[0]||"";
  const tn=S.tsTeam,list=(rows[tn]||[]).sort(posSort);
  if(S.tsFor!==tn){S.tsFor=tn;const l=teamLevel(tn);S.tsLvl=l!=null?String(l):"fly"}
  const lv=S.tsLvl,cols=lv==="fly"?[{h:"Flyer body positions",items:flyerList().map(n=>({key:"Flyer|"+n,name:n}))}]
    :cats().map(k=>({h:k.cat,items:k.items.filter(i=>i.level===+lv).map(i=>({key:i.key,name:i.name}))})).filter(g=>g.items.length);
  const items=cols.flatMap(g=>g.items);
  const ath=list.map(x=>x.a);
  const cell=(a,i)=>{const tk=tickOf(a,i.key),t=techOf(a,i.key),vs=(a.videos||[]).filter(v=>v.skill===i.key);
    return `<td class="c"><div class="tsc ${tk?"y":""}">${tk?`<span class="cmy">✓</span>`:`<span class="cmn">–</span>`}${t!=null?`<span class="cms t-${techCls(t)}">${t.toFixed(1)}</span>`:""}${vs.length?`<button class="tsv" data-act="tsVid" data-id="${a.id}" data-k="${esc(i.key)}">🎥${vs.length>1?vs.length:""}</button>`:""}</div></td>`};
  const sum=a=>{const n=items.filter(i=>tickOf(a,i.key)).length,ts=items.map(i=>techOf(a,i.key)).filter(v=>v!=null);return `${n}/${items.length}${ts.length?` · ${(ts.reduce((x,y)=>x+y,0)/ts.length).toFixed(1)}`:""}`};
  return `<div class="catop"><button class="icon" data-act="tsBack" aria-label="Back">‹</button><div class="catt"><h2>Team stats</h2><small>${esc(tn||"No teams yet")}${list.length?` · ${list.length} athletes`:""}</small></div></div>
  <div class="tsbar">
    <div class="bchips">${names.map(n=>`<button class="chip ${n===tn?"on":""}" data-act="tsTeam" data-v="${esc(n)}">${esc(n)} <small>${rows[n].length}</small></button>`).join("")||`<p class="help">No 2027 placements yet.</p>`}</div>
    <div class="bchips">${CUR_LEVELS.map(l=>`<button class="chip gold ${lv===String(l)?"on":""}" data-act="tsLvl" data-v="${l}">${lvlName(l)}</button>`).join("")}<button class="chip gold ${lv==="fly"?"on":""}" data-act="tsLvl" data-v="fly">Flyer positions</button></div>
  </div>
  ${tn&&items.length?`<div class="cawrap"><table class="catab tstab">
    <thead><tr><th class="nm" rowspan="2">Athlete</th><th class="grp" rowspan="2" style="min-width:132px">Position</th>${cols.map(g=>`<th class="grp" colspan="${g.items.length}">${esc(g.h)}</th>`).join("")}<th class="grp" rowspan="2">Total</th></tr>
      <tr>${items.map(i=>`<th class="sk2">${esc(i.name)}</th>`).join("")}</tr></thead>
    <tbody>${ath.map(a=>`<tr class="${primaryPos(a)==="Flyer"?"flyrow":""}"><td class="nm"><button data-act="tsOpen" data-id="${a.id}">${thumb(a,30)}<span><b>${esc(fullName(a))}</b><small>${esc(aCode(a))}${isCur(a)?"":" · new"}</small></span></button></td>
      <td class="c">${posSelect(a)}</td>${items.map(i=>cell(a,i)).join("")}<td class="c tsum">${sum(a)}</td></tr>`).join("")}
    <tr class="cafoot"><td class="nm">Team</td><td></td>${items.map(i=>`<td>${ath.filter(a=>tickOf(a,i.key)).length}/${ath.length}</td>`).join("")}<td></td></tr></tbody>
  </table></div>
  <p class="help" style="text-align:center;margin:10px 20px 0">Pick a team and level above. Change positions with the dropdown. Tap 🎥 to watch a clip, or a name for their profile.</p>`
  :`<div class="empty"><b>${tn?"No skills at this level":"No placements yet"}</b>${tn?"Pick another level.":"Suggest teams first."}</div>`}`}
function tsVidHtml(a,k){const vs=(a.videos||[]).filter(v=>v.skill===k).sort((x,y)=>y.at-x.at);
  return `<div class="mhead"><h3 style="margin:0">${esc(fullName(a))} · ${esc(skillName(k))}</h3><button class="icon" data-act="closeModal" aria-label="Close">✕</button></div><div class="vrow" style="margin:0">${vs.map(vidCard).join("")}</div>`}

function boardCurrent(){
  const known=TIERS.cheer.flatMap(t=>t.teams.map(x=>x.name));
  const groups=CUR_TIERS.map(ct=>({name:ct.name,teams:curTierTeams(ct.id).map(x=>x.name)}));
  const extra=[...new Set(S.current.flatMap(a=>(a.curTeams||[]).map(t=>t.team)).filter(n=>!known.includes(n)))].sort();
  if(extra.length)groups.push({name:"Other teams",teams:extra});
  const totalOut=S.current.filter(a=>agesOut(a).length).length;
  const allTeams=groups.flatMap(g=>g.teams.filter(tn=>S.current.some(a=>(a.curTeams||[]).some(t=>t.team===tn))));
  if(S.bteam&&!allTeams.includes(S.bteam))S.bteam="";
  let h=`<p class="help" style="margin:0 0 10px">Your 2026 teams. <b style="color:var(--bad)">Red</b> means the athlete is too old for that team's age group in 2027 (ages are on 31 Dec 2027).${totalOut?` ${totalOut} athlete${totalOut===1?"":"s"} age out.`:""}${isDirector()?" Use the dropdown to suggest a 2027 team.":""}</p>`;
  h+=`<div class="bchips">${["",...allTeams].map(tn=>`<button class="chip ${(S.bteam||"")===tn?"on":""}" data-act="bTeam" data-v="${esc(tn)}">${tn?esc(tn):"All teams"}</button>`).join("")}</div>`;
  let shownAny=false;
  groups.forEach(g=>{
    const cards=g.teams.filter(tn=>!S.bteam||tn===S.bteam).map(tn=>{
      const mem=S.current.filter(a=>(a.curTeams||[]).some(t=>t.team===tn)&&bMatch(a)).sort((x,y)=>(x.last||"").localeCompare(y.last||"")||(x.first||"").localeCompare(y.first||""));
      if(!mem.length)return "";
      const ti=teamInfo(tn),mx=teamMax(tn),out=mem.filter(a=>a.dob&&mx!=null&&divAge(a.dob)>mx);
      const canStay=a=>ti&&!(a.dob&&mx!=null&&divAge(a.dob)>mx)&&!plist(a,"cheer").some(e=>e.team===tn),nStay=isDirector()?mem.filter(canStay).length:0;
      return `<div class="bteam"><div class="bth"><div><b>${esc(tn)}</b><span>${ti?esc([ti.sub,ti.div].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i).join(" · ")):""}${mx!=null&&mx<99?` · max age ${mx}`:""}</span></div><em>${mem.length}</em></div>
        ${out.length||nStay?`<div class="bcnt">${out.length?`<span class="outc">${out.length} age${out.length===1?"s":""} out</span>`:""}${nStay?`<button class="stayall" data-act="bStayAll" data-t="${esc(tn)}">↺ All stay (${nStay})</button>`:""}</div>`:""}
        ${mem.map(a=>{const age=a.dob?divAge(a.dob):null,old=age!=null&&mx!=null&&age>mx;
          return `<div class="browx ${old?"old":""}"><button class="brow" data-act="openTeams" data-id="${a.id}">${thumb(a,30)}<span class="bn"><b>${esc(fullName(a))}</b><small>${curCode(a)?curCode(a)+" · ":""}${age!=null?`${age} in ${ageYear()}`:"No DOB"}${posName(a)?" · "+esc(posName(a)):""}</small>${old?`<span class="outb">Ages out → ${divFor(age)}</span>`:""}${sugChips(a)}</span></button>${isDirector()&&ti&&!old?(plist(a,"cheer").some(e=>e.team===tn)?`<span class="staydone">✓ Staying</span>`:`<button class="staybtn" data-act="bStay" data-id="${a.id}" data-t="${esc(tn)}">↺ Stay</button>`):""}${sugSelect(a)}</div>`}).join("")}</div>`}).join("");
    if(cards.trim()){shownAny=true;h+=`<div class="btier">${esc(g.name)}</div><div class="bgrid">${cards}</div>`}
  });
  return shownAny?h:h+`<div class="empty"><b>${S.bq?"No matches":"No current athletes yet"}</b>${S.bq?"Try a different name.":"Import your roster from Current athletes."}</div>`}

/* ---------- Directors hub ---------- */
function vHub(){
  const me=myEmail(),all=S.athletes;
  const cnt=k=>all.filter(a=>statusOf(a)===k).length;
  const COL={assess:"var(--bad)",suggest:"#f08a24",approve:"#f5b041",complete:"var(--ok)"};
  const total=all.length||1;
  const mine=pendingFor(me);
  const pend=[];allAth().forEach(a=>discsOf(a).forEach(d=>plist(a,d).forEach(p=>{if(!isFinal(p))pend.push({a,d,p})})));
  const waiting=[];const finals=[];
  allAth().forEach(a=>discsOf(a).forEach(d=>plist(a,d).forEach(p=>{const ap=apprList(p);
    if(isFinal(p))finals.push({a,d,p,at:Math.max(...ap.map(e=>(p.approvals[e]||{}).at||0))});
    else if(ap.includes(me))waiting.push({a,d,p})})));
  finals.sort((x,y)=>y.at-x.at);
  const ready=[];allAth().forEach(a=>{if(!doneOf(a,"assessment"))return;discsOf(a).forEach(d=>{if(!plist(a,d).length)ready.push({a,d})})});
  const card=(x,btn)=>`<div class="hcard">${thumb(x.a,46)}<div class="hc"><b>${esc(fullName(x.a))}${isCur(x.a)?'<span class="curtag">Current</span>':""}</b><small>${x.a.dob?`Age ${divAge(x.a.dob)} · ${esc(divLabel(x.a))}`:"No DOB"}</small>
      <div class="hteam"><span class="hd2 ${x.d}">${x.d==="cheer"?"Cheer":"Dance"}</span><b>${esc(teamLbl(x.p))}</b></div>
      <small>Suggested by ${esc(x.p.by||"a coach")} · ${apprList(x.p).length?`approved by ${apprList(x.p).map(dirName).join(", ")}`:"no approvals yet"}</small></div>
      <div class="hbtns">${btn}<button class="btn ghost" data-act="openTeams" data-id="${x.a.id}">View</button></div></div>`;
  return `<div class="top"><button class="icon" data-act="go" data-v="home">‹</button><div class="logo" style="font-size:16px">Directors <span>hub</span></div><span style="width:38px"></span></div>
  <div class="hubwrap">
    <div class="hsec"><h3>Current athletes progress</h3>
      <div class="pipe">${CUR_ORDER.map(k=>`<i style="width:${S.current.filter(a=>curStatus(a)===k).length/(S.current.length||1)*100}%;background:${{report:"var(--bad)",assess:"#e0675c",suggest:"#f08a24",approve:"#f5b041",complete:"var(--ok)"}[k]}"></i>`).join("")}</div>
      <div class="pipel five">${CUR_ORDER.map(k=>`<button data-act="hubFilterCur" data-v="${k}"><b style="color:${{report:"var(--bad)",assess:"#e0675c",suggest:"#f08a24",approve:"#f5b041",complete:"var(--ok)"}[k]}">${S.current.filter(a=>curStatus(a)===k).length}</b>${CUR_SHORT[k]}</button>`).join("")}</div></div>
    <div class="hsec"><h3>Tryout progress</h3>
      <div class="pipe">${STATUS_ORDER.map(k=>`<i style="width:${cnt(k)/total*100}%;background:${COL[k]}"></i>`).join("")}</div>
      <div class="pipel">${STATUS_ORDER.map(k=>`<button data-act="hubFilter" data-v="${k}"><b style="color:${COL[k]}">${cnt(k)}</b>${STATUS_SHORT[k]}</button>`).join("")}</div></div>
    ${isDirector()?`<div class="hsec"><h3>Needs your approval <span>${mine.length}</span></h3>
      ${mine.length?mine.map(x=>card(x,`<button class="btn okbtn" data-act="hubApprove" data-id="${x.a.id}" data-d="${x.d}" data-k="${x.p.key}">✓ Approve</button>`)).join(""):`<p class="hnone">You're all caught up ✦</p>`}</div>
    <div class="hsec"><h3>Waiting on a second approval <span>${waiting.length}</span></h3>
      ${waiting.length?waiting.map(x=>card(x,"")).join(""):`<p class="hnone">Nothing waiting.</p>`}</div>`
    :`<div class="hsec"><h3>Waiting on director approval <span>${pend.length}</span></h3>
      ${pend.length?pend.map(x=>card(x,"")).join(""):`<p class="hnone">Nothing waiting.</p>`}</div>`}
    <div class="hsec"><h3>Ready for a team suggestion <span>${ready.length}</span></h3>
      <p class="help" style="margin:-4px 0 8px">Assessed, but no team suggested yet.</p>
      ${ready.length?`<div class="bunsug">${ready.map(x=>`<button class="brow" data-act="openTeams" data-id="${x.a.id}">${thumb(x.a,30)}<span class="bn"><b>${esc(fullName(x.a))}${isCur(x.a)?'<span class="curtag">Current</span>':""}</b><small>${x.d==="cheer"?"Cheer":"Dance"}${x.a.dob?" · Age "+divAge(x.a.dob):""}</small></span><i class="no">!</i></button>`).join("")}</div>`:`<p class="hnone">Nobody waiting.</p>`}</div>
    <div class="hsec"><h3>Recently finalised <span>${finals.length}</span></h3>
      ${finals.length?`<div class="bunsug">${finals.slice(0,12).map(x=>`<button class="brow" data-act="openTeams" data-id="${x.a.id}">${thumb(x.a,30)}<span class="bn"><b>${esc(fullName(x.a))}</b><small>${esc(teamLbl(x.p))} · ${fmtDay(x.at)}</small></span><i class="ok">✓</i></button>`).join("")}</div>`:`<p class="hnone">No final placements yet.</p>`}</div>
    <div class="hsec"><h3>Tools</h3><div class="htools">
      <button class="tool" data-act="go" data-v="board">▦ Teams board</button><button class="tool" data-act="go" data-v="import">⬆ Import athletes</button>
      <button class="tool" data-act="go" data-v="print">🖨 Print list</button><button class="tool" data-act="exportTryBtn">⬇ Export tryouts</button>
      <button class="tool" data-act="exportCurBtn">⬇ Export current</button>${isDirector()?`<button class="tool" data-act="rollGo">🔁 Season rollover</button>`:""}</div></div>
  </div>`;
}

function loadPdfLib(){if(loadPdfLib.p)return loadPdfLib.p;
  loadPdfLib.p=loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js")).then(()=>{if(S.view==="print")render()}).catch(e=>{loadPdfLib.p=null;toast("Couldn't load printing. Check your internet and try again.")});
  return loadPdfLib.p}
function buildPdf(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297;
  const list=S.athletes.slice().sort((a,b)=>(a.num||0)-(b.num||0));
  const title=`${S.settings.season} tryouts`;
  if(S.printMode==="cards"){
    const cols=2,rows=4,m=10,g=6,cw=(W-2*m-g*(cols-1))/cols,ch=(H-2*m-g*(rows-1))/rows;
    list.forEach((a,i)=>{const k=i%(cols*rows);if(i&&k===0)doc.addPage();
      const x=m+(k%cols)*(cw+g),y=m+Math.floor(k/cols)*(ch+g);
      doc.setDrawColor(20);doc.setLineWidth(0.8);doc.roundedRect(x,y,cw,ch,4,4);
      doc.setFont("helvetica","bold");doc.setFontSize(88);doc.setTextColor(20);doc.text(pad3(a.num),x+cw/2,y+ch*0.58,{align:"center"});
      doc.setFontSize(14);doc.text(fullName(a),x+cw/2,y+ch-9,{align:"center",maxWidth:cw-8})});
  }else{
    doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text(title,12,16);
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(110);doc.text(`${list.length} athletes · printed ${new Date().toLocaleDateString("en-AU")}`,12,22);
    doc.autoTable({startY:27,margin:{left:12,right:12},styles:{fontSize:9,cellPadding:2,valign:"top"},headStyles:{fillColor:[232,164,211],textColor:20},
      head:[["#","Name",`Age ${ageYear()}`,"Age groups","Trying out","Medical","Here"]],
      body:list.map(a=>[pad3(a.num),fullName(a),a.dob?String(divAge(a.dob)):"",divLabel(a),TYPE_LABEL[a.tryoutType]||"",a.medical||"",""]),
      columnStyles:{0:{fontStyle:"bold",cellWidth:14},2:{cellWidth:14},6:{cellWidth:12}},
      didDrawCell:d=>{if(d.section==="body"&&d.column.index===6){const sz=4.5;d.doc.setDrawColor(60);d.doc.rect(d.cell.x+(d.cell.width-sz)/2,d.cell.y+1.8,sz,sz)}}});
  }
  return doc;
}

function impFields(){return S.impCur?IMP_FIELDS_CUR:IMP_FIELDS}
function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}
  if(f!==""||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>String(v).trim()!==""))}
function impDate(v,fmt){if(v==null||v==="")return "";if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  const t=String(v).trim();let m;const pad=n=>String(n).padStart(2,"0");
  if((m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=y>30?1900:2000;
    let dd,mm;if(fmt==="mdy"){mm=a;dd=b}else if(fmt==="dmy"){dd=a;mm=b}else{if(a>12){dd=a;mm=b}else if(b>12){mm=a;dd=b}else{dd=a;mm=b}}
    if(mm<1||mm>12||dd<1||dd>31)return "";return `${y}-${pad(mm)}-${pad(dd)}`}
  const d=new Date(t);return isNaN(d)?"":`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function impType(v){const t=String(v||"").toLowerCase();const c=/cheer/.test(t),d=/dance/.test(t);return c&&d?"both":c?"cheer":d?"dance":""}
function impRows(){const I=S.imp;if(!I)return [];const col=k=>I.map[k]===""||I.map[k]==null?-1:+I.map[k];
  const g=(r,k)=>{const i=col(k);return i<0?"":String(r[i]??"").trim()};
  return I.rows.map(r=>{let first=g(r,"first"),last=g(r,"last");if(!first&&g(r,"full")){const p=g(r,"full").split(/\s+/);first=p.shift()||"";last=p.join(" ")}
    const dob=impDate(I.raw?(r[col("dob")]):g(r,"dob"),I.fmt);
    let o;
    if(I.cur){o={first,last,dob,parentName:g(r,"parentName"),parentPhone:g(r,"parentPhone"),parentEmail:g(r,"parentEmail"),medical:g(r,"medical"),curTeams:impTeams([g(r,"team"),g(r,"team2"),g(r,"team3")].filter(Boolean).join(",")),positions:impPos(g(r,"pos")),tryoutType:"cheer"};o.pos=o.positions.includes("Flyer")?"flyer":(o.positions.length||/base/i.test(g(r,"pos")))?"base":"";o.flyerAssess=o.positions.includes("Flyer");
      o.tier=impTier(g(r,"tier"))||(["premier","novice","cheerstarz"].find(t=>o.curTeams.some(x=>tierOfTeam(x.team)===t))||"")}
    else{o={first,last,dob,parentName:g(r,"parentName"),parentPhone:g(r,"parentPhone"),parentEmail:g(r,"parentEmail"),prevGym:g(r,"prevGym"),experience:g(r,"experience"),medical:g(r,"medical")};
      const ty=impType(g(r,"type"));if(ty)o.tryoutType=ty;}
    const key=(first+"|"+last+"|"+dob).toLowerCase();
    o._dup=(I.cur?S.current:S.athletes).some(a=>((a.first||"")+"|"+(a.last||"")+"|"+(a.dob||"")).toLowerCase()===key);
    o._badDob=g(r,"dob")!==""&&!dob;return o}).filter(o=>o.first&&o.first.split(/\s+/).length<=4&&(o.last||o.dob))}

      ${rows.length>40?`<p class="help" style="padding:6px">…and ${rows.length-40} more</p>`:""}</div>

/* =============================== RENDER =============================== */
function render(){
  const app=document.getElementById("app");
  const ae=document.activeElement,focusId=ae&&ae.id&&ae.hasAttribute("data-keep")?ae.id:null;
  let sel=null;try{if(focusId)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  const keep={};app.querySelectorAll("[data-keep]").forEach(el=>{if(el.id)keep[el.id]=el.value});
  const sameView=render._last===S.view+"|"+S.id+"|"+S.tab;
  let html;
  switch(S.view){
    case "loading":html=`<div class="loading">Loading…</div>`;break;
    case "login":html=vLogin();break;
    case "home":html=vHome();break;
    case "profile":html=vProfile();break;
    case "add":case "edit":html=vForm();break;
    case "quick":html=vQuick();break;
    case "compare":html=vCompare();break;
    case "settings":html=vSettings();break;
    case "board":html=vBoard();break;
    case "class":html=vClass();break;
    case "rollover":html=vRollover();break;
    case "tstats":html=vTeamStats();break;
    case "hub":html=isAdmin()?vHub():vHome();break;
    case "import":html=vImport();break;
    case "print":html=vPrint();break;
    default:html=vHome();
  }
  const y=window.scrollY;
  app.innerHTML=html;
  if(sameView){
    for(const [id,v] of Object.entries(keep)){const el=document.getElementById(id);if(el&&id!=="search")el.value=v}
    window.scrollTo(0,y);
  }
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  render._last=S.view+"|"+S.id+"|"+S.tab;
  const tb=document.querySelector(".tabs .on");if(tb){const w=tb.parentElement;if(tb.offsetLeft<w.scrollLeft||tb.offsetLeft+tb.offsetWidth>w.scrollLeft+w.clientWidth)w.scrollLeft=tb.offsetLeft-12}
}
function go(view,extra={}){
  if((view==="add"||view==="edit")&&S.view!=="add"&&S.view!=="edit")S.cf=null;
  if(view==="print"&&S.view!=="print")S.printBack=S.view==="hub"?"hub":"settings";
  Object.assign(S,{view},extra);
  if(view!=="add"&&view!=="edit"&&S.pendingPhoto){URL.revokeObjectURL(S.pendingPhoto.url);S.pendingPhoto=null}
  render();window.scrollTo(0,0);
}

async function uploadSkillPhoto(id,file,skill){
  const a=find(id);if(!a)return;const ts=Date.now(),path=`athletes/${id}/photos/${ts}.jpg`,uid="p"+ts;
  let blob;try{blob=await compressImageMax(file,1600)}catch(e){toast("Couldn't read that photo");return}
  S.uploads[uid]={athleteId:id,pct:0,skill,label:`${skillName(skill)} photo`};if(S.view==="profile")render();
  try{const url=await B.uploadFile(path,blob,p=>{S.uploads[uid].pct=p;const el=document.querySelector(`[data-up="${uid}"]`);if(el){el.querySelector(".pct").textContent=Math.round(p)+"%";el.querySelector(".bar i").style.width=p+"%"}});
    await B.addToList(id,"videos",{url,path,skill,at:ts,by:coachName(),kind:"photo"});toast(`Photo saved to ${a.first||"profile"} ✦`)}
  catch(e){toast("Upload failed: "+e.message)}
  delete S.uploads[uid];if(S.view==="profile")render();
}
async function compressImageMax(file,max){
  const url=URL.createObjectURL(file);
  try{const im=await loadImg(url);const sc=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85))}
  finally{URL.revokeObjectURL(url)}
}
async function uploadVideo(id,file,skill,extra={}){
  const a=find(id);if(!a)return;
  if(file.size>MAX_VIDEO_MB*1024*1024){toast(`That clip is over ${MAX_VIDEO_MB}MB, probably filmed in 4K. Trim it, or set the camera to 1080p (Settings > Camera > Record Video).`);return}
  const dur=await videoDuration(file);
  if(dur>MAX_VIDEO_SECONDS+1){toast(`That clip is ${Math.round(dur)} sec. Trim it to ${MAX_VIDEO_SECONDS} sec or less first.`);return}
  const ts=Date.now(),ext=((file.name||"").split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"mp4";
  const path=`athletes/${id}/videos/${ts}.${ext}`,uid="u"+ts;
  S.uploads[uid]={athleteId:id,pct:0,skill,label:`${skillName(skill)} for ${a.first||"athlete"}`};
  toast("Uploading video…");if(S.view==="profile"||S.view==="class")render();
  try{
    const url=await B.uploadFile(path,file,p=>{
      S.uploads[uid].pct=p;const el=document.querySelector(`[data-up="${uid}"]`);
      if(el){el.querySelector(".pct").textContent=Math.round(p)+"%";el.querySelector(".bar i").style.width=p+"%"}
      if(S.view==="class"&&!(uploadVideo._t>Date.now()-600)){uploadVideo._t=Date.now();render()}
    });
    await B.addToList(id,"videos",{url,path,skill,at:ts,by:coachName(),dur:Math.round(dur)||0,...extra});
    toast(`Video saved to ${a.first||"profile"} ✦`);
  }catch(e){toast("Upload failed: "+e.message)}
  delete S.uploads[uid];if(S.view==="profile"||S.view==="class")render();
}

    a.danceAllstar===true?"Yes":a.danceAllstar===false?"No":"",danceStylesTxt(a),a.danceExperience||"",a.danceAssessNotes||"",
    ...DANCE_CATS.flatMap(c=>{const x=(a.danceSkills||{})[c.id]||{};return [x.level||"",x.notes||""]}),
    ...["cheer","dance"].flatMap(d=>{const l=plist(a,d);return [[...new Set(l.map(p=>(TIERS[d].find(x=>x.id===p.tier)||{}).name||""))].join(", "),l.map(p=>(isFinal(p)?"✓ ":"")+teamLbl(p)).join(" / "),l.map(p=>`${p.team}: ${apprList(p).map(dirName).join(", ")||"none"}`).join("; ")]}),
    ...SECTIONS.map(x=>doneOf(a,x[0])?"Yes":"No"),(a.videos||[]).length,(a.notes||[]).map(n=>`${n.by}: ${n.text}`).join(" | ")]);
  const csv=[head,...rows].map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv"});const url=URL.createObjectURL(blob);
  const l=document.createElement("a");l.href=url;l.download=`EOD-tryouts-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Spreadsheet downloaded");
}

/* ============================ EVENT WIRING ============================ */
window.addEventListener("unhandledrejection",e=>{const m=(e.reason&&(e.reason.message||e.reason))||"Something went wrong";toast(String(m).slice(0,140))});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const fn=actions[el.dataset.act];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){S.q=e.target.value;render()}
  if(e.target.id==="csearch"){S.cq=e.target.value;render()}
  if(e.target.id==="ca-q"){caState().q=e.target.value;caSave();render()}
  if(e.target.id==="ca-name"){caState().name=e.target.value;caSave()}
  if(e.target.id==="ga-addq"){S.gaAddQ=e.target.value;const pos=e.target.selectionStart;openModal(gaAddHtml());const q=document.getElementById("ga-addq");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(er){}}}
  if(e.target.id==="bsearch"){S.bq=e.target.value;render()}
  if(e.target.id==="ca-gq"){caState().gq=e.target.value;render()}
  if(e.target.id==="vc-range"&&S.vc){const v=+e.target.value;S.vc.tech=v;S.vc.scored=true;e.target.classList.remove("unset");
    const val=document.getElementById("vc-val"),lb=document.getElementById("vc-lbl"),sv=document.getElementById("vc-save");
    if(val)val.innerHTML=v.toFixed(1)+"<small> / 5</small>";if(lb){lb.textContent=techLabel(v);lb.className="vclbl t-"+techCls(v)}if(sv&&S.vc.file)sv.textContent="Save video + score"}
  if(e.target.id==="f-dob"){const d=e.target.value;const el=document.getElementById("f-div");if(el)el.textContent=d?`${ageTxt(d)} · ${groupsMainAge(divAge(d),document.getElementById("saveBtn")&&document.getElementById("saveBtn").dataset.act==="saveCur"?["cheer"]:["cheer","dance"]).join(" / ")}`:"–"}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sortSel"){S.sort=t.value;render();return}
  if(t.id==="boardEmpty"){S.boardEmpty=t.checked;render();return}
  if(t.dataset&&t.dataset.imp&&S.imp){S.imp.map[t.dataset.imp]=t.value;render();return}
  if(t.dataset&&t.dataset.impfmt&&S.imp){S.imp.fmt=t.value;render();return}
  if(t.dataset&&t.dataset.save&&S.id){B.updateAthlete(S.id,{[t.dataset.save]:t.value.trim()}).then(()=>toast("Notes saved")).catch(er=>toast("Couldn't save: "+er.message))}
  if(t.dataset&&t.dataset.dnote&&S.id){B.setField(S.id,["danceSkills",t.dataset.dnote,"notes"],t.value.trim()||null).then(()=>toast("Notes saved")).catch(er=>toast("Couldn't save: "+er.message))}
  if(t.dataset&&t.dataset.repcm&&S.id){const a=find(S.id);if(a){const cur=(a.reports||{})[myEmail()]||{};saveReport(a,{...cur,r:cur.r||{},comment:t.value.trim()}).then(()=>toast("Comment saved"))}}
  if(t.dataset&&t.dataset.pos){const a=find(t.dataset.pos);if(a)setPrimaryPos(a,t.value);return}
  if(t.dataset&&t.dataset.sug&&t.value){const a=find(t.dataset.sug),[tier,...nm]=t.value.split("|");t.disabled=true;if(a)addSuggestion(a,"cheer",tier,nm.join("|"));return}
  if(e.target.id==="teamSel"){B.updateAthlete(e.target.dataset.id,{team:e.target.value}).then(()=>toast(e.target.value?"Team set":"Team cleared"))}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&S.view==="login"&&e.target.tagName==="INPUT")actions.login()});

/* ============================ INSTALLABLE APP ============================ */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;if(S.view==="home")render()});
window.addEventListener("appinstalled",()=>{S.installEvt=null;toast("Installed ✦ Find EOD Tryouts on your home screen");render()});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ================================ START ================================ */
const FORM_VIEWS=["add","edit","settings"];
applyTeams();
(async function start(){
  try{await B.init()}catch(e){document.getElementById("app").innerHTML=`<div class="empty"><b>Couldn't connect</b>${esc(e.message)}</div>`;return}
  B.onAuth(u=>{
    S.user=u;
    if(!u){B.unlisten();S.athletes=[];S.current=[];S.ready=false;go("login");return}
    S.view="loading";render();
    B.listen(list=>{
      S.athletes=list;setTimeout(fixCnums,800);
      const first=!S.ready;S.ready=true;
      if(first){go("home");return}
      if(!FORM_VIEWS.includes(S.view))render();
    },st=>{
      S.settings={...clone(DEFAULT_SETTINGS),...(st||{})};applyTeams();
      if(S.ready&&!FORM_VIEWS.includes(S.view))render();
    },cur=>{
      S.current=cur;fixCnums();
      if(S.ready&&!FORM_VIEWS.includes(S.view))render();
    });
  });
})();
</script>
