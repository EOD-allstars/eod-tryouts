<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EOD Tryouts">
<title>EOD Tryout Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= EOD COLOURS (edit these to match branding) ================= */
:root{
  color-scheme:dark;
  --bg:#0d0b14; --card:#1a1625; --card2:#231d33; --line:#2e2742;
  --pink:#ff3d9a; --pink2:#ff7ac0; --gold:#ffc94d; --teal:#3de0c8; --red:#ff8a8a;
  --txt:#f5f2fa; --mut:#9b93ad;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px;padding-top:env(safe-area-inset-top)}
.sparkle{position:absolute;color:var(--gold);opacity:.7;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;gap:10px}
.logo{font-weight:800;font-size:20px;letter-spacing:.5px}
.logo span{color:var(--pink)}
.sub{color:var(--mut);font-size:12px}
.icon{min-width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:16px;border:1px solid var(--line);padding:0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 18px 12px}
.stat{background:var(--card);border-radius:14px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:22px}
.stat small{font-size:10px;color:var(--mut)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 18px 12px}
.tool{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 4px;font-size:12px;font-weight:600;text-align:center}
.tool.on{border-color:var(--pink);color:var(--pink2)}
.search{display:block;width:calc(100% - 36px);margin:0 18px 10px;background:var(--card);border-radius:12px;padding:11px 14px;font-size:16px;border:1px solid var(--line);outline:none}
.search:focus{border-color:var(--pink)}
.chips{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);color:var(--mut);white-space:nowrap;border:1px solid var(--line);flex:none}
.chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.chip.gold.on{background:var(--gold);color:#3a2a00;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px}
.tile{background:var(--card);border-radius:18px;padding:10px;border:1px solid var(--line);position:relative;text-align:left;width:100%}
.tile.sel{border:2px solid var(--pink);box-shadow:0 0 0 3px rgba(255,61,154,.2)}
.ph{height:128px;border-radius:12px;display:grid;place-items:center;font-size:32px;font-weight:700;color:rgba(255,255,255,.92);position:relative;overflow:hidden}
.ph img,.av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);font-size:11px;padding:2px 7px;border-radius:8px;font-weight:700;z-index:2}
.tile h4{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile p{font-size:11px;color:var(--mut)}
.badge{position:absolute;top:16px;right:16px;font-size:9px;padding:3px 7px;border-radius:8px;font-weight:600;z-index:2}
.b-assessed{background:var(--teal);color:#063}
.b-new{background:var(--gold);color:#432}
.b-placed{background:var(--pink);color:#fff}
.check{position:absolute;bottom:56px;right:16px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid #fff;display:grid;place-items:center;font-size:13px;z-index:3}
.tile.sel .check{background:var(--pink);border-color:var(--pink)}
.g0{background:linear-gradient(135deg,#ff3d9a,#7b3dff)}.g1{background:linear-gradient(135deg,#ffc94d,#ff6b6b)}
.g2{background:linear-gradient(135deg,#3de0c8,#3d7bff)}.g3{background:linear-gradient(135deg,#b06bff,#ff7ac0)}
.g4{background:linear-gradient(135deg,#ff8a3d,#ff3d9a)}.g5{background:linear-gradient(135deg,#3d7bff,#3de0c8)}
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:max(22px,calc(50% - 238px));width:60px;height:60px;border-radius:20px;background:var(--pink);display:grid;place-items:center;font-size:32px;color:#fff;box-shadow:0 8px 24px rgba(255,61,154,.5);z-index:20}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(13,11,20,.95);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:20}
.bottombar>*{max-width:240px;flex:1}
.empty{text-align:center;color:var(--mut);padding:40px 30px;font-size:14px}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}
/* profile */
.hero{position:relative;height:210px;background:linear-gradient(160deg,#ff3d9a 0%,#7b3dff 100%)}
.hero .back{position:absolute;top:16px;left:18px;background:rgba(0,0,0,.25);border:0}
.hero .edit{position:absolute;top:16px;right:18px;background:rgba(0,0,0,.25);border:0}
.av{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);width:116px;height:116px;border-radius:50%;border:4px solid var(--bg);display:grid;place-items:center;font-size:40px;font-weight:700;overflow:hidden}
.cam{position:absolute;bottom:-44px;left:calc(50% + 30px);width:36px;height:36px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:15px;border:3px solid var(--bg);z-index:3}
.pname{text-align:center;margin-top:58px;padding:0 18px}
.pname h2{font-size:22px}
.pname p{font-size:12px;color:var(--mut)}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:10px 18px 14px}
.tag{font-size:11px;padding:5px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.tag.pk{color:var(--pink2)}.tag.gd{color:var(--gold)}.tag.tl{color:var(--teal)}
.teamsel{background:var(--card2);border:1px solid var(--gold);color:var(--gold);border-radius:10px;font-size:16px;max-width:100%;padding:4px 8px;outline:none}
.tabs{display:flex;margin:0 18px 14px;background:var(--card);border-radius:14px;padding:4px;position:sticky;top:0;z-index:5}
.tabs button{flex:1;text-align:center;font-size:12px;padding:9px 0;border-radius:10px;color:var(--mut)}
.tabs .on{background:var(--pink);color:#fff;font-weight:600}
.cat{background:var(--card);border-radius:16px;padding:12px 14px;margin:0 18px 10px;border:1px solid var(--line)}
.cat-h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.cat-h span{color:var(--mut);font-weight:500;font-size:11px}
.bar{height:6px;background:var(--card2);border-radius:4px;margin-bottom:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:4px;transition:width .3s}
.sk{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line)}
.seg{display:flex;gap:4px;flex:none}
.seg button{font-size:10px;font-weight:600;padding:6px 7px;border-radius:8px;background:var(--card2);color:var(--mut)}
.sk .skn{min-width:0;line-height:1.35}
.vb{display:flex;align-items:center;gap:3px;font-size:13px;padding:5px 7px!important;border:1px solid var(--line)!important;margin-left:2px}
.vb b{font-size:10px;color:var(--pink2)}
.vb.has{border-color:var(--pink)!important;background:#2e1a2a!important}
.lvlhead{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1px;padding:12px 0 4px;border-top:1px solid var(--line)}
.lvlhead span{color:var(--mut);font-weight:500;text-transform:none;letter-spacing:0}
.vrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -14px 2px;padding:0 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vrow::-webkit-scrollbar{display:none}
.vcard{flex:0 0 74%;max-width:260px;scroll-snap-align:start;background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0}
.vcard .vth{height:150px}
.vcard .m{padding:8px 10px}
.vcard h5{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard p{font-size:10.5px;color:var(--mut)}
.vcard.up{display:flex;flex-direction:column;justify-content:center;padding:14px;font-size:12px;min-height:200px}
.vcount{font-size:11px;color:var(--pink2);font-weight:600;margin-top:10px}
.lvlcard{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:14px;margin:0 18px 12px}
.lvlcard h4{font-size:15px;margin-bottom:2px}
.lvlcard .chips{padding:0;margin:8px 0 12px;flex-wrap:wrap}
.lvlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 18px 12px;font-size:12.5px}
.lvlbar b{color:var(--gold)}
.lvlbar button{color:var(--pink2);font-weight:600;font-size:12px;padding:4px}
.cat.locked{opacity:.55}
.lvlhead+.sk{border-top:0}
.linkbtn{color:var(--mut);font-size:12px;text-decoration:underline;padding:8px 4px;display:block;margin:6px auto 0}
.seg .no.on{background:#3a2a3a;color:var(--red)}.seg .wk.on{background:#4a3a1a;color:var(--gold)}.seg .ys.on{background:#1a3d38;color:var(--teal)}
.info{margin:0 18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.info .r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.info .r:first-child{border-top:0}
.info .r span{color:var(--mut);flex:none}
.info .r b{font-weight:500;text-align:right;word-break:break-word}
.info .r a{color:var(--pink2);text-decoration:none}
.med{color:var(--gold)!important}
/* videos */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.vid{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.vth{height:110px;position:relative;display:grid;place-items:center;overflow:hidden}
.vth video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:13px;position:relative;z-index:2}
.dur{position:absolute;bottom:6px;right:6px;font-size:10px;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:6px;z-index:2}
.vid .m{padding:8px 10px}
.vid h5{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vid p{font-size:10px;color:var(--mut)}
.upload{margin:12px 18px 0;border:2px dashed var(--pink);border-radius:16px;padding:16px;text-align:center;color:var(--pink2);font-size:14px;font-weight:600;width:calc(100% - 36px);display:block}
.upload small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:3px}
.upbar{margin:10px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px}
.upbar .bar{margin:6px 0 0}
/* notes */
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 18px 8px;font-size:13px;position:relative}
.note small{display:block;color:var(--mut);font-size:10.5px;margin-top:4px}
.note .x{position:absolute;top:6px;right:8px;color:var(--mut);font-size:14px;padding:4px}
textarea.in{min-height:80px;resize:vertical}
/* forms */
.form{padding:0 18px}
label{display:block;font-size:11px;color:var(--mut);margin:0 0 5px 2px}
.in{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;margin-bottom:12px;outline:none}
.in:focus{border-color:var(--pink)}
select.in{appearance:none;-webkit-appearance:none}
input[type=date].in{min-height:46px;min-width:0;-webkit-appearance:none;appearance:none}
.row>*,.grid>*,.tools>*,.stats>*{min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auto{background:var(--card2);border:1px solid var(--pink);color:var(--pink2);border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:12px;font-weight:600;min-height:46px}
.btn{display:block;width:100%;background:var(--pink);color:#fff;text-align:center;font-weight:700;border-radius:16px;padding:14px;font-size:15px}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:600}
.btn.danger{background:#3a1f2a;color:var(--red);border:1px solid #5a2a3a;font-weight:600}
.btn:disabled{opacity:.5}
.photo-pick{display:flex;gap:10px;margin-bottom:16px;align-items:stretch}
.pp{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 6px;text-align:center;font-size:12px;font-weight:600}
.pp i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.pp.main{border:2px solid var(--pink);color:var(--pink2)}
.preview{width:96px;height:96px;border-radius:16px;overflow:hidden;flex:none;position:relative;display:grid;place-items:center;font-size:28px;font-weight:700}
.preview img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ttl{font-size:20px;font-weight:700;padding:0 18px 2px}
.sect{font-size:13px;font-weight:700;color:var(--pink2);margin:18px 0 8px}
.help{font-size:11px;color:var(--mut);margin:-6px 2px 12px;line-height:1.5}
/* login */
.login{display:flex;flex-direction:column;justify-content:center;min-height:92vh;padding:0 30px;position:relative}
.big-logo{font-size:46px;font-weight:800;text-align:center;line-height:1}
.big-logo span{color:var(--pink)}
.hub{text-align:center;color:var(--gold);letter-spacing:6px;font-size:13px;font-weight:600;margin:10px 0 6px}
.season{text-align:center;color:var(--mut);font-size:12px;margin-bottom:36px}
.lock{text-align:center;color:var(--mut);font-size:11px;margin-top:18px;line-height:1.6}
.err{color:var(--red);font-size:12px;margin:-4px 0 12px;text-align:center}
.demo{background:#2a2410;border:1px solid #5a4a1a;color:var(--gold);font-size:11.5px;border-radius:12px;padding:10px 12px;margin:0 18px 12px;line-height:1.5}
/* quick assess */
.qa-h{text-align:center;padding:4px 18px 10px}
.qa-h small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:1.5px}
.qa-h h3{font-size:21px;color:var(--gold);margin-top:2px}
.prog{margin:0 18px 6px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.card-big{margin:10px 26px 0;background:var(--card);border-radius:26px;padding:16px;border:1px solid var(--line);text-align:center}
.card-big .ph{height:min(48vh,300px);font-size:60px;border-radius:18px}
.card-big h3{font-size:22px;margin-top:12px}
.card-big p{font-size:12px;color:var(--mut)}
.cur{font-size:11px;margin-top:6px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 22px 0}
.rb{border-radius:18px;padding:16px 4px;text-align:center;font-size:13px;font-weight:700;border:2px solid transparent}
.rb i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
.rb-no{background:#3a2a3a;color:var(--red)}.rb-wk{background:#4a3a1a;color:var(--gold)}.rb-ys{background:#1a3d38;color:var(--teal)}
.rb.on{border-color:currentColor}
.qnav{display:flex;justify-content:space-between;margin:14px 26px 0;font-size:13px;color:var(--mut)}
.qnav button{color:var(--mut);padding:6px 4px}
.qvid{margin:14px 22px 0;width:calc(100% - 44px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--pink2);font-weight:600}
.skillpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
/* compare */
.cmp{margin:0 12px;overflow-x:auto}
.cmp table{width:100%;border-collapse:collapse;font-size:12px}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--txt)}
.cmp .ch td{color:var(--pink2);font-weight:700;padding-top:14px;text-align:left}
.cmp .mini{width:46px;height:46px;border-radius:12px;margin:0 auto 4px;position:relative;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:16px}
.cmp .mini img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cmp th{font-size:11px;font-weight:600;vertical-align:bottom}
.dot-ys{color:var(--teal);font-weight:700}.dot-wk{color:var(--gold);font-weight:700}.dot-no{color:var(--red);font-weight:700}.dot-na{color:#555}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.mbox{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.mbox h3{font-size:17px;margin-bottom:12px}
.mbox video{width:100%;max-height:62vh;border-radius:14px;background:#000;display:block;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;font-size:13px;font-weight:600;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:60;max-width:88vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.install{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--pink);border-radius:14px;padding:10px 12px;margin:0 18px 12px;font-size:12px;line-height:1.45}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install div{flex:1}
.install b{display:block;font-size:13px}
.install .go{background:var(--pink);color:#fff;font-weight:700;border-radius:10px;padding:8px 12px;font-size:12px;flex:none}
.install .x{color:var(--mut);font-size:18px;padding:2px 4px;flex:none}
.loading{display:grid;place-items:center;min-height:80vh;color:var(--mut)}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>

/* =====================================================================

const DEFAULT_SETTINGS = {
  season: "2027 Season",
  ageAsAt: "2027-12-31",
  divisions: [
    {name:"Tiny",max:6},{name:"Mini",max:9},{name:"Youth",max:12},
    {name:"Junior",max:15},{name:"Senior",max:18},{name:"Open",max:99}
  ],
  teams: [],
  skills: [

/* =============================== HELPERS =============================== */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ymd(s){if(!s)return null;const p=String(s).split("-").map(Number);return p.length===3&&!p.some(isNaN)?p:null}
function ageAt(dob,ref){const d=ymd(dob);if(!d)return null;let a=ref[0]-d[0];if(ref[1]<d[1]||(ref[1]===d[1]&&ref[2]<d[2]))a--;return a}
function today(){const n=new Date();return [n.getFullYear(),n.getMonth()+1,n.getDate()]}
function ageNow(dob){return ageAt(dob,today())}
function ageYear(){const d=ymd(S.settings.ageAsAt);return d?d[0]:today()[0]}
function divAge(dob){return ageAt(dob,ymd(S.settings.ageAsAt)||today())}
function divisionOf(dob){const a=divAge(dob);if(a==null)return "";const ds=S.settings.divisions||[];for(const d of ds){if(a<=d.max)return d.name}return ds.length?ds[ds.length-1].name:""}
function fmtDob(dob){const d=ymd(dob);return d?`${String(d[2]).padStart(2,"0")}/${String(d[1]).padStart(2,"0")}/${d[0]}`:""}
function fmtWhen(ts){const d=new Date(ts);return d.toLocaleDateString("en-AU",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})}
function fmtDay(ts){return new Date(ts).toLocaleDateString("en-AU",{day:"numeric",month:"short"})}
function initials(a){return ((a.first||"?")[0]+((a.last||"")[0]||"")).toUpperCase()}
function grad(a){return "g"+((a.num||0)%6)}
function fullName(a){return `${a.first||""} ${a.last||""}`.trim()||"Unnamed"}
function pad3(n){return "#"+String(n||0).padStart(3,"0")}
function normItem(it){
  if(it&&typeof it==="object")return {name:String(it.name||"").trim(),level:it.level?+it.level:null};
  const t=String(it||"").trim(),m=t.match(/^L(\d+)\s*[:\-.]?\s*(.+)$/i);
  return m?{name:m[2].trim(),level:+m[1]}:{name:t,level:null};
}
function cats(){return (S.settings.skills||[]).map(c=>({cat:c.cat,items:(c.items||[]).map(normItem).filter(i=>i.name).map(i=>({...i,key:c.cat+"|"+i.name}))}))}
function skillList(){const out=[];cats().forEach(c=>c.items.forEach(i=>out.push({cat:c.cat,name:i.name,level:i.level,key:i.key})));return out}
function levelList(){const l=[...new Set(skillList().map(i=>i.level).filter(Boolean))].sort((a,b)=>a-b);return l.length?l:[1,2,3,4,5,6]}
function hasLevels(a){return a.tumbleMain!=null&&a.tumbleMain!==""}
function canSee(a,item){if(!item.level)return true;if(!hasLevels(a)||+a.tumbleMain===0)return true;return item.level===+a.tumbleMain||item.level===+a.tumbleSecond}
function levelsTxt(a){if(!hasLevels(a))return "";if(+a.tumbleMain===0)return "All levels";return "L"+a.tumbleMain+(a.tumbleSecond?" + L"+a.tumbleSecond:"")}
function ageTxt(dob){return dob?`Age ${divAge(dob)}`:""}
function skillName(key){if(!key||key==="general")return "General";const i=key.indexOf("|");return i<0?key:key.slice(i+1)}
function skillCat(key){if(!key||key==="general")return "General";const i=key.indexOf("|");return i<0?"General":key.slice(0,i)}
function statusOf(a){if(a.team)return "placed";const s=a.skills||{};return Object.keys(s).length?"assessed":"new"}
const STATUS_LABEL={new:"To see",assessed:"Assessed",placed:"Placed"};

function coachName(){try{const n=localStorage.getItem("eodth_coach");if(n)return n}catch(e){}return S.user&&S.user.email?S.user.email.split("@")[0]:"Coach"}
function photoHtml(a){return a.photoURL?`<img src="${esc(a.photoURL)}" alt="">`:esc(initials(a))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function openModal(html){const m=document.getElementById("modal");m.innerHTML=`<div class="mback" data-act="closeModal"></div><div class="mbox">${html}</div>`;m.classList.add("open")}

function pickFile(accept,capture){
  return new Promise(res=>{
    const i=document.createElement("input");i.type="file";i.accept=accept;i.style.display="none";
    if(capture)i.setAttribute("capture",capture);
    i.onchange=()=>{res(i.files[0]||null);i.remove()};
    document.body.appendChild(i);i.click();
  });
}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await loadImg(url);
    const sc=Math.min(1,PHOTO_MAX_PX/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
  }finally{URL.revokeObjectURL(url)}
}
function videoDuration(file){
  return new Promise(res=>{
    const v=document.createElement("video");v.preload="metadata";v.muted=true;
    const done=d=>{URL.revokeObjectURL(v.src);res(d)};
    v.onloadedmetadata=()=>done(v.duration);v.onerror=()=>done(0);
    setTimeout(()=>done(0),8000);
    v.src=URL.createObjectURL(file);
  });
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Could not load "+src));document.head.appendChild(s)})}

/* ======================= BACKEND: FIREBASE ======================= */
function FirebaseBackend(){
  let fb,db,st,auth,unA,unS;
  const V="10.12.2",base=`https://www.gstatic.com/firebasejs/${V}/`;
  return {
    async init(){
      for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js","firebase-storage-compat.js"])await loadScript(base+f);
      fb=window.firebase;fb.initializeApp(FIREBASE_CONFIG);
      auth=fb.auth();db=fb.firestore();st=fb.storage();
      try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    },
    onAuth(cb){auth.onAuthStateChanged(u=>cb(u?{email:u.email,uid:u.uid}:null))},
    signIn(e,p){return auth.signInWithEmailAndPassword(e,p)},
    signOut(){return auth.signOut()},
    listen(onA,onS){
      unA=db.collection("athletes").onSnapshot(s=>onA(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast("Sync error: "+e.message));
      unS=db.doc("config/settings").onSnapshot(d=>onS(d.exists?d.data():null),e=>toast("Sync error: "+e.message));
    },
    unlisten(){unA&&unA();unS&&unS()},
    newId(){return db.collection("athletes").doc().id},
    async createAthlete(id,data){
      const sref=db.doc("config/settings"),aref=db.collection("athletes").doc(id);
      await db.runTransaction(async t=>{
        const s=await t.get(sref);const n=((s.exists&&s.data().counter)||0)+1;
        t.set(sref,{counter:n},{merge:true});
        t.set(aref,{...data,num:n,skills:{},notes:[],videos:[],createdAt:Date.now()});
      });
    },
    updateAthlete(id,patch){return db.collection("athletes").doc(id).update(patch)},
    setRating(id,key,v){
      const FP=fb.firestore.FieldPath,FV=fb.firestore.FieldValue;
      return db.collection("athletes").doc(id).update(new FP("skills",key),v==null?FV.delete():v);
    },
    addToList(id,field,item){return db.collection("athletes").doc(id).update({[field]:fb.firestore.FieldValue.arrayUnion(item)})},
    removeFromList(id,field,item){return db.collection("athletes").doc(id).update({[field]:fb.firestore.FieldValue.arrayRemove(item)})},
    uploadFile(path,blob,onP){
      return new Promise((res,rej)=>{
        const task=st.ref(path).put(blob,{contentType:blob.type||"application/octet-stream"});
        task.on("state_changed",s=>onP&&onP(s.bytesTransferred/s.totalBytes*100),rej,async()=>{try{res(await task.snapshot.ref.getDownloadURL())}catch(e){rej(e)}});
      });
    },
    async deleteFile(path){if(!path)return;try{await st.ref(path).delete()}catch(e){}},
    async deleteAthlete(a){
      for(const v of a.videos||[])await this.deleteFile(v.path);
      await this.deleteFile(a.photoPath);
      await db.collection("athletes").doc(a.id).delete();
    },
    saveSettings(patch){return db.doc("config/settings").set(patch,{merge:true})}
  };
}

}

function tSkills(a){
  const s=a.skills||{},cs=cats();
  if(!cs.length)return `<div class="empty">No skills set up yet. Add them in Settings.</div>`;
  const leveled=c=>c.items.some(i=>i.level);
  const anyLev=cs.some(leveled);
  const picking=anyLev&&(!hasLevels(a)||(S.lvl&&S.lvl.id===a.id));
  const vids=(a.videos||[]).slice().sort((x,y)=>y.at-x.at);
  const catNames=cs.map(c=>c.cat);
  let out="";
  if(anyLev)out+=picking?levelPicker(a):`<div class="lvlbar"><span>Tumbling: <b>${esc(+a.tumbleMain===0?"All levels":`Level ${a.tumbleMain}`)}</b>${a.tumbleSecond?` + <b>Level ${a.tumbleSecond}</b>`:""}</span><button data-act="lvlChange">Change</button></div>`;
  out+=cs.map(c=>{
    const catVids=vids.filter(v=>skillCat(v.skill)===c.cat);
    if(leveled(c)&&!hasLevels(a))return `<div class="cat locked"><div class="cat-h">${esc(c.cat)}<span>Pick levels above</span></div>${vidRow(a,catVids,k=>skillCat(k)===c.cat)}</div>`;
    const items=c.items.filter(i=>canSee(a,i)).sort((x,y)=>(x.level||0)-(y.level||0));
    const has=items.filter(i=>s[i.key]===2).length;
    let lastLvl=null,rows="";
    items.forEach(i=>{
      if(i.level&&i.level!==lastLvl){
        const tag=i.level===+a.tumbleMain?"main":(i.level===+a.tumbleSecond?"secondary":"");
        rows+=`<div class="lvlhead">Level ${i.level} ${tag?`<span>· ${tag}</span>`:""}</div>`;lastLvl=i.level;
      }
      const v=s[i.key],n=vids.filter(x=>x.skill===i.key).length;
      rows+=`<div class="sk"><span class="skn">${esc(i.name)}</span><div class="seg">${[0,1,2].map(x=>`<button class="${RATING[x].c} ${v===x?"on":""}" data-act="rate" data-id="${a.id}" data-k="${esc(i.key)}" data-v="${x}">${RATING[x].t}</button>`).join("")}<button class="vb ${n?"has":""}" data-act="skillVid" data-k="${esc(i.key)}" aria-label="Add video of ${esc(i.name)}">🎥${n?`<b>${n}</b>`:""}</button></div></div>`;
    });
    return `<div class="cat"><div class="cat-h">${esc(c.cat)}<span>${has} of ${items.length}</span></div>
      <div class="bar"><i style="width:${items.length?has/items.length*100:0}%"></i></div>
      ${rows}${vidRow(a,catVids,k=>skillCat(k)===c.cat)}</div>`;
  }).join("");
  const other=vids.filter(v=>!catNames.includes(skillCat(v.skill)));
  out+=`<div class="cat"><div class="cat-h">Other videos<span>${other.length||""}</span></div>
    <div class="sub">Clips that aren't for one skill, like a full run-through.</div>
    ${vidRow(a,other,k=>!catNames.includes(skillCat(k)))}

    <p class="help" style="text-align:center;margin:8px 30px 0">Tap 🎥 on any skill to film it or pick a clip. It's saved to that skill automatically.</p>`;
  return out;
}

/* =============================== RENDER =============================== */
function render(){
  const app=document.getElementById("app");
  const ae=document.activeElement,focusId=ae&&ae.id&&ae.hasAttribute("data-keep")?ae.id:null;
  let sel=null;try{if(focusId)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  const keep={};app.querySelectorAll("[data-keep]").forEach(el=>{if(el.id)keep[el.id]=el.value});
  const sameView=render._last===S.view+"|"+S.id+"|"+S.tab;
  let html;
  switch(S.view){
    case "loading":html=`<div class="loading">Loading…</div>`;break;
    case "login":html=vLogin();break;
    case "home":html=vHome();break;
    case "profile":html=vProfile();break;
    case "add":case "edit":html=vForm();break;
    case "quick":html=vQuick();break;
    case "compare":html=vCompare();break;
    case "settings":html=vSettings();break;
    default:html=vHome();
  }
  const y=window.scrollY;
  app.innerHTML=html;
  if(sameView){
    for(const [id,v] of Object.entries(keep)){const el=document.getElementById(id);if(el&&id!=="search")el.value=v}
    window.scrollTo(0,y);
  }
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  render._last=S.view+"|"+S.id+"|"+S.tab;
}
function go(view,extra={}){
  Object.assign(S,{view},extra);
  if(view!=="add"&&view!=="edit"&&S.pendingPhoto){URL.revokeObjectURL(S.pendingPhoto.url);S.pendingPhoto=null}
  render();window.scrollTo(0,0);
}

  closeModal(){closeModal();if(ask._res){ask._res(false);ask._res=null}},

  askYes(el){const t=el.dataset.typed;if(t&&document.getElementById("askTyped").value.trim().toUpperCase()!==t){toast(`Type ${t} to confirm`);return}
    closeModal();ask._res&&ask._res(true);ask._res=null},
  async login(){
    const e=document.getElementById("l-email").value.trim(),p=document.getElementById("l-pass").value;
    if(!DEMO&&(!e||!p)){S.loginErr="Enter your email and password";return render()}
    S.loginErr="";
    try{await B.signIn(e,p)}catch(err){S.loginErr=/password|user|credential/i.test(err.code||err.message)?"Email or password is incorrect":err.message;render()}
  },
  async logout(){if(await ask("Log out?","Log out"))await B.signOut();},
  go(el){const v=el.dataset.v;go(v,{compareMode:v==="compare"||(v==="home"&&S.view==="compare")?S.compareMode:false})},
  open(el){go("profile",{id:el.dataset.id,tab:S.view==="quick"?"skills":(S.id===el.dataset.id?S.tab:"info"),lvl:null})},
  tab(el){S.tab=el.dataset.v;render()},
  div(el){S.div=el.dataset.v;render()},
  status(el){S.status=el.dataset.v;render()},
  vfilter(el){S.vfilter=el.dataset.v;render()},
  toggleCompare(){S.compareMode=!S.compareMode;S.compareSel=[];render()},
  cmpSel(el){const id=el.dataset.id,i=S.compareSel.indexOf(id);if(i>=0)S.compareSel.splice(i,1);else if(S.compareSel.length<3)S.compareSel.push(id);else toast("Compare up to 3 at a time");render()},
  add(){go("add",{id:null})},
  edit(){go("edit")},
  async formPhoto(el){
    const f=await pickFile("image/*",el.dataset.v==="camera"?"environment":null);if(!f)return;
    try{const blob=await compressImage(f);if(S.pendingPhoto)URL.revokeObjectURL(S.pendingPhoto.url);S.pendingPhoto={blob,url:URL.createObjectURL(blob)};render()}
    catch(e){toast("Couldn't read that photo")}
  },
  async saveForm(){
    const g=id=>(document.getElementById("f-"+id).value||"").trim();
    const d={first:g("first"),last:g("last"),dob:g("dob"),parentName:g("parentName"),parentPhone:g("parentPhone"),parentEmail:g("parentEmail"),prevGym:g("prevGym"),experience:g("experience"),medical:g("medical")};
    const lm=document.getElementById("f-lvlMain").value,ls=document.getElementById("f-lvlSec").value;
    d.tumbleMain=lm===""?null:+lm;d.tumbleSecond=(ls===""||d.tumbleMain===0||+ls===d.tumbleMain)?null:+ls;
    if(!d.first){toast("First name is needed");return}
    const btn=document.getElementById("saveBtn");btn.disabled=true;btn.textContent="Saving…";
    try{
      const id=S.view==="edit"?S.id:B.newId();
      if(S.pendingPhoto){const path=`athletes/${id}/photo.jpg`;d.photoURL=await B.uploadFile(path,S.pendingPhoto.blob);d.photoPath=path}
      if(S.view==="edit")await B.updateAthlete(id,d);else await B.createAthlete(id,d);
      toast(S.view==="edit"?"Saved":"Athlete added ✦");
      go("profile",{id,tab:S.view==="edit"?S.tab:"info"});
    }catch(e){toast("Save failed: "+e.message);btn.disabled=false;btn.textContent="Try again"}
  },
  async delAthlete(){
    const a=find(S.id);if(!a)return;
    if(!await ask(`Delete ${fullName(a)}? This removes their profile, photo and videos for good.`))return;
    await B.deleteAthlete(a);toast("Deleted");go("home");
  },
  async photo(){
    const a=find(S.id);const f=await pickFile("image/*");if(!f||!a)return;
    toast("Uploading photo…");
    try{const blob=await compressImage(f);const path=`athletes/${a.id}/photo.jpg`;const url=await B.uploadFile(path,blob);
      await B.updateAthlete(a.id,{photoURL:url,photoPath:path});toast("Photo updated")}catch(e){toast("Photo upload failed: "+e.message)}
  },
  rate(el){
    const a=find(el.dataset.id);const k=el.dataset.k,v=+el.dataset.v;
    const cur=(a.skills||{})[k];B.setRating(a.id,k,cur===v?null:v).catch(e=>toast("Couldn't save: "+e.message));
  },
  async addNote(){
    const t=document.getElementById("noteText"),text=t.value.trim();if(!text)return;
    t.value="";await B.addToList(S.id,"notes",{text,by:coachName(),at:Date.now()});
  },
  async delNote(el){
    const a=find(S.id);const n=(a.notes||[]).find(x=>String(x.at)===el.dataset.at);
    if(n&&await ask("Delete this note?"))await B.removeFromList(a.id,"notes",n);
  },
  addVideo(){videoModal(S.id,null)},
  skillVid(el){const k=el.dataset.k,id=S.id;pickFile("video/*").then(f=>{if(f)uploadVideo(id,f,k)})},
  lvlMain(el){const a=find(S.id);S.lvl=(S.lvl&&S.lvl.id===a.id)?S.lvl:{id:a.id,main:null,sec:null};S.lvl.main=+el.dataset.v;if(S.lvl.sec===S.lvl.main)S.lvl.sec=null;render()},
  lvlSec(el){const a=find(S.id);S.lvl=(S.lvl&&S.lvl.id===a.id)?S.lvl:{id:a.id,main:null,sec:null};S.lvl.sec=el.dataset.v?+el.dataset.v:null;render()},
  async lvlSave(){const d=S.lvl;if(!d||!d.main)return;S.lvl=null;await B.updateAthlete(d.id,{tumbleMain:d.main,tumbleSecond:d.sec||null});toast(`Assessing Level ${d.main}${d.sec?" + "+d.sec:""}`)},
  async lvlAll(){const id=S.id;S.lvl=null;await B.updateAthlete(id,{tumbleMain:0,tumbleSecond:null})},
  lvlChange(){const a=find(S.id);S.lvl={id:a.id,main:+a.tumbleMain||null,sec:a.tumbleSecond?+a.tumbleSecond:null};render();window.scrollTo(0,document.querySelector(".tabs").offsetTop)},
  lvlCancel(){S.lvl=null;render()},
  playVid(el){
    const a=find(S.id);const v=(a.videos||[]).find(x=>String(x.at)===el.dataset.at);if(!v)return;
    openModal(`<h3>${esc(skillName(v.skill))} <span class="sub">· ${fmtDay(v.at)}</span></h3>
      <video src="${esc(v.url)}" controls autoplay playsinline></video>
      <p class="sub" style="margin-bottom:14px">${esc(skillCat(v.skill))}${v.by?" · added by "+esc(v.by):""}</p>
      <div class="row"><button class="btn danger" data-act="delVid" data-at="${v.at}">Delete</button><button class="btn ghost" data-act="closeModal">Close</button></div>`);
  },
  async delVid(el){
    const a=find(S.id);const v=(a.videos||[]).find(x=>String(x.at)===el.dataset.at);if(!v)return;
    closeModal();if(!await ask("Delete this video?"))return;await B.removeFromList(a.id,"videos",v);await B.deleteFile(v.path);toast("Video deleted");
  },
  async pickVideo(el){
    const skill=document.getElementById("vSkill").value,id=el.dataset.id;
    const f=await pickFile("video/*",el.dataset.v==="camera"?"environment":null);
    closeModal();if(f)uploadVideo(id,f,skill);
  },
  qaStart(){go("quick",{qa:{div:S.div,skill:null,ids:[],i:0}})},
  qaDiv(el){S.qa.div=el.dataset.v;render()},
  qaSkill(el){
    const d=S.qa.div;
    const item=skillList().find(i=>i.key===el.dataset.v)||{};
    S.qa.ids=S.athletes.filter(a=>(d==="All"||divisionOf(a.dob)===d)&&canSee(a,item)).sort((x,y)=>(x.num||0)-(y.num||0)).map(a=>a.id);
    if(!S.qa.ids.length){toast("No athletes to assess for that skill and division");return}
    S.qa.skill=el.dataset.v;S.qa.i=0;render();window.scrollTo(0,0);
  },
  qaNewSkill(){S.qa.skill=null;render()},
  qaRestart(){S.qa.i=0;render()},
  qaRate(el){
    const id=S.qa.ids[S.qa.i];B.setRating(id,S.qa.skill,+el.dataset.v).catch(e=>toast("Couldn't save: "+e.message));
    S.qa.i++;render();
  },
  qaPrev(){if(S.qa.i>0){S.qa.i--;render()}},
  qaNext(){S.qa.i++;render()},
  async qaFilm(){
    const id=S.qa.ids[S.qa.i];const f=await pickFile("video/*","environment");if(f)uploadVideo(id,f,S.qa.skill);
  },
  export:exportCsv,
  async saveSettings(){
    const v=id=>document.getElementById(id).value;
    const divLines=v("s-div").split("\n").map(l=>l.trim()).filter(Boolean);
    const divisions=divLines.map(l=>{const nums=l.match(/\d+/g);const name=l.split(/[\d:]/)[0].replace(/[\s\-–]+$/,"").trim();return nums&&name?{name,max:+nums[nums.length-1]}:null});
    const bad=divLines.find((l,i)=>!divisions[i]);
    if(bad||!divisions.length){toast(bad?`Check this division line: "${bad}". It needs a name and an age, like "Mini: 9"`:"Add at least one division");return}
    const btn=document.querySelector('[data-act="saveSettings"]');if(btn){btn.disabled=true;btn.textContent="Saving…"}
    const skills=[];let cur=null;
    v("s-skills").split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
      if(l.startsWith("#")){cur={cat:l.replace(/^#+/,"").trim()||"Other",items:[]};skills.push(cur)}
      else{if(!cur){cur={cat:"Skills",items:[]};skills.push(cur)}const it=normItem(l);if(it.name&&!cur.items.some(x=>x.name===it.name))cur.items.push(it.level?{name:it.name,level:it.level}:{name:it.name,level:null})}
    });
    try{localStorage.setItem("eodth_coach",v("s-coach").trim())}catch(e){}
    const slow=setTimeout(()=>toast("Still saving… check you have internet"),8000);
    try{
      await B.saveSettings({season:v("s-season").trim()||"Tryouts",ageAsAt:v("s-asat")||S.settings.ageAsAt||DEFAULT_SETTINGS.ageAsAt,divisions,teams:v("s-teams").split("\n").map(l=>l.trim()).filter(Boolean),skills:skills.filter(c=>c.items.length)});
      clearTimeout(slow);toast("Settings saved");go("home");
    }catch(e){clearTimeout(slow);toast("Couldn't save settings: "+(e.message||e));if(btn){btn.disabled=false;btn.textContent="Save settings"}}
  },
  async clearVideos(){
    const n=S.athletes.reduce((n,a)=>n+(a.videos||[]).length,0);if(!n){toast("No videos to delete");return}
    if(!await ask(`Delete all ${n} videos? This can't be undone.`,"Delete all","DELETE"))return;
    toast("Deleting videos…");
    for(const a of S.athletes){for(const v of a.videos||[])await B.deleteFile(v.path);if((a.videos||[]).length)await B.updateAthlete(a.id,{videos:[]})}
    toast("All videos deleted");
  }
};

function videoModal(id){
  const opts=`<option value="general">General / other</option>`+cats().map(c=>`<optgroup label="${esc(c.cat)}">${c.items.map(i=>`<option value="${esc(i.key)}">${esc(i.name)}</option>`).join("")}</optgroup>`).join("");
  openModal(`<h3>Add a video</h3>
    <label for="vSkill">Which skill is this?</label><select class="in" id="vSkill">${opts}</select>
    <div class="row" style="margin-top:4px"><button class="btn" data-act="pickVideo" data-v="camera" data-id="${id}">🎥 Film now</button>
    <button class="btn ghost" data-act="pickVideo" data-v="roll" data-id="${id}">🖼️ Camera roll</button></div>
    <p class="help" style="margin-top:12px">Clips up to ${MAX_VIDEO_SECONDS} seconds. Trim longer videos in your Photos app first.</p>`);
}

async function uploadVideo(id,file,skill){
  const a=find(id);if(!a)return;
  if(file.size>MAX_VIDEO_MB*1024*1024){toast(`That video is too big (over ${MAX_VIDEO_MB}MB). Trim it first.`);return}
  const dur=await videoDuration(file);
  if(dur>MAX_VIDEO_SECONDS+1){toast(`That clip is ${Math.round(dur)} sec. Trim it to ${MAX_VIDEO_SECONDS} sec or less first.`);return}
  const ts=Date.now(),ext=((file.name||"").split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,5)||"mp4";
  const path=`athletes/${id}/videos/${ts}.${ext}`,uid="u"+ts;
  S.uploads[uid]={athleteId:id,pct:0,skill,label:`${skillName(skill)} for ${a.first||"athlete"}`};
  toast("Uploading video…");if(S.view==="profile")render();
  try{
    const url=await B.uploadFile(path,file,p=>{
      S.uploads[uid].pct=p;const el=document.querySelector(`[data-up="${uid}"]`);
      if(el){el.querySelector(".pct").textContent=Math.round(p)+"%";el.querySelector(".bar i").style.width=p+"%"}
    });
    await B.addToList(id,"videos",{url,path,skill,at:ts,by:coachName(),dur:Math.round(dur)||0});
    toast(`Video saved to ${a.first||"profile"} ✦`);
  }catch(e){toast("Upload failed: "+e.message)}
  delete S.uploads[uid];if(S.view==="profile")render();
}

function exportCsv(){
  const sk=skillList();
  const head=["Tryout #","First name","Last name","DOB",`Age in ${ageYear()}`,"Division","Tumbling levels","Status","Suggested team","Parent","Phone","Email","Previous gym","Experience","Medical notes",...sk.map(s=>s.cat+": "+s.name),"Videos","Notes"];
  const rows=S.athletes.slice().sort((a,b)=>(a.num||0)-(b.num||0)).map(a=>[a.num,a.first,a.last,fmtDob(a.dob),a.dob?divAge(a.dob):"",divisionOf(a.dob),levelsTxt(a),STATUS_LABEL[statusOf(a)],a.team,a.parentName,a.parentPhone,a.parentEmail,a.prevGym,a.experience,a.medical,
    ...sk.map(s=>{const v=(a.skills||{})[s.key];return v==null?"":RATING[v].t}),(a.videos||[]).length,(a.notes||[]).map(n=>`${n.by}: ${n.text}`).join(" | ")]);
  const csv=[head,...rows].map(r=>r.map(c=>{const s=String(c??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv"});const url=URL.createObjectURL(blob);
  const l=document.createElement("a");l.href=url;l.download=`EOD-tryouts-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Spreadsheet downloaded");
}

/* ============================ EVENT WIRING ============================ */
window.addEventListener("unhandledrejection",e=>{const m=(e.reason&&(e.reason.message||e.reason))||"Something went wrong";toast(String(m).slice(0,140))});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  const fn=actions[el.dataset.act];if(fn){e.preventDefault();fn(el)}
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){S.q=e.target.value;render()}
  if(e.target.id==="f-dob"){const d=e.target.value;const el=document.getElementById("f-div");if(el)el.textContent=d?`${ageTxt(d)} · ${divisionOf(d)}`:"–"}
});
document.addEventListener("change",e=>{
  if(e.target.id==="teamSel"){B.updateAthlete(e.target.dataset.id,{team:e.target.value}).then(()=>toast(e.target.value?"Team set":"Team cleared"))}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&S.view==="login"&&e.target.tagName==="INPUT")actions.login()});

/* ============================ INSTALLABLE APP ============================ */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.installEvt=e;if(S.view==="home")render()});
window.addEventListener("appinstalled",()=>{S.installEvt=null;toast("Installed ✦ Find EOD Tryouts on your home screen");render()});
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ================================ START ================================ */
const FORM_VIEWS=["add","edit","settings"];
(async function start(){
  try{await B.init()}catch(e){document.getElementById("app").innerHTML=`<div class="empty"><b>Couldn't connect</b>${esc(e.message)}</div>`;return}
  B.onAuth(u=>{
    S.user=u;
    if(!u){B.unlisten();S.athletes=[];S.ready=false;go("login");return}
    S.view="loading";render();
    B.listen(list=>{
      S.athletes=list;
      const first=!S.ready;S.ready=true;
      if(first){go("home");return}
      if(!FORM_VIEWS.includes(S.view))render();
    },st=>{
      S.settings={...clone(DEFAULT_SETTINGS),...(st||{})};
      if(S.ready&&!FORM_VIEWS.includes(S.view))render();
    });
  });
})();
</script>
